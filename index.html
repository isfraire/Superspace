<script>
/* =====================================================================
   SUPERSPACE - Castaway of Oru
   A retro side-scrolling platformer played with hand gestures.
   One file, no build step. Host it anywhere that serves HTTPS
   (the camera only works on a secure address), e.g. GitHub Pages.

   MAP OF THIS FILE (search for the  ####  banners)
     1. TUNING ........ gesture thresholds, game feel, difficulty  <-- tweak here
     2. UTILITIES + SAVE DATA
     3. SOUND ......... sound effects and music, all generated in code
     4. PIXEL ART ..... every sprite, tile and backdrop, drawn in code
     5. GAME DATA ..... worlds, courses, enemies, bosses (data-driven)
     6. ENGINE ........ level loading, physics, hero, camera, HUD
     7. HAND TRACKING . camera, MediaPipe, gesture detection
     8. SCREENS ....... title, calibration, gesture test, menus, pause
     9. MAIN LOOP
   ===================================================================== */
(() => {
'use strict';

const VIEW_W = 480, VIEW_H = 270;   // internal resolution (16:9), scaled up with hard pixels
const TS = 16;                      // tile size in pixels

/* #####################################################################
   1. TUNING
   Everything you are likely to want to tweak is in this one object.
   ##################################################################### */
const TUNE = {

  /* ---------- GESTURE THRESHOLDS ------------------------------------
     Sliders on the Gesture Test screen override the ones marked (slider);
     the numbers here are the defaults / the slider ranges.             */
  gesture: {
    holdFrames: 2,          // (slider) tracking frames a pose must persist before it counts. 2-4.
    minScore: 0.50,         // (slider) minimum confidence for the built-in Open_Palm / Closed_Fist.

    // --- finger-walk (run) ---
    walkSens: 0.55,         // (slider) 0..1, higher = smaller finger movements count as steps
    walkSwapEasy: 0.07,     // fingertip travel (in hand-lengths) that counts as a swap at sensitivity 1
    walkSwapHard: 0.32,     // ... and at sensitivity 0
    walkStartSwaps: 2,      // fingertip swaps needed before the hero starts running
    walkSwapGap: 0.75,      // max seconds between two swaps for them to count as walking
    walkTimeoutMin: 0.28,   // after the last swap, walking ends after 1.6x the last step time,
    walkTimeoutMax: 0.50,   //   clamped between these two (seconds)
    walkRateSlow: 2.0,      // swaps per second that give the slowest run
    walkRateFast: 5.0,      // swaps per second that give full speed
    walkMinSpeed: 0.55,     // run speed (0..1) at the slow rate
    easyRunSpeed: 0.80,     // "Easy run" setting: speed when two fingers are simply held out
    walkDepthWeight: 0.6,   // how much landmark depth (z) counts in the finger-walk signal
    walkBaselineTau: 0.45,  // seconds; how fast the "neutral" fingertip offset adapts

    // --- open palm (jump) / fist (spin) ---
    reopenDrop: 0.20,       // hand "openness" must drop this far below the open-palm level
                            //   before a new open palm counts as another jump (double jump)
    rearmTime: 0.70,        // ... or the palm must be gone this long (seconds)
    fistAirDelay: 0.22,     // mid-air, a fist waits this long before spinning so that
                            //   open-close-open can be read as a double jump instead
    fistRepeat: 0,          // seconds between repeat spins while a fist is held (0 = one spin per fist)

    // --- direction-hand swipe (face left / right) ---
    swipeSens: 0.50,        // (slider) 0..1, higher = slower swipes count
    swipeSpeedEasy: 3.5,    // hand-lengths per second needed at sensitivity 1
    swipeSpeedHard: 13,     // ... and at sensitivity 0
    swipeTravel: 1.0,       // minimum travel in hand-lengths
    swipeWindow: 0.35,      // seconds of history searched for a swipe
    swipeCooldown: 0.30,    // seconds before any new swipe
    swipeReturnBlock: 0.65, // seconds the opposite direction is ignored (the hand moving back)

    // --- presence ---
    dropout: 0.25,          // seconds a hand may vanish before its gesture is cleared
    handsLostPause: 1.2,    // seconds with no hand in view before the game pauses
    handsBackResume: 0.5,   // seconds hands must be back before the resume countdown starts
    menuPalmHold: 0.9,      // seconds an open palm must be held to press a menu button
  },

  /* ---------- TRACKING LOAD -----------------------------------------
     Tracking runs on its own schedule, never inside the game step. After
     every hand-tracking pass the game is guaranteed `ceil(cost * budget)`
     rendered frames before the next pass, which keeps it above 30 fps
     even when a pass is slow. Raise `budget` for a smoother game and
     slower tracking; lower it for the opposite.                        */
  tracking: { maxHz: 30, budget: 0.065, camWidth: 640, camHeight: 480 },

  /* ---------- GAME FEEL (forgiveness) --------------------------------- */
  feel: {
    runHold: 0.40,        // seconds the hero keeps running after finger-walking stops
    airCarry: true,       // keep that run speed for the whole jump if it started while running
    landCarry: 0.30,      // ... and this long after landing
    coyote: 0.18,         // seconds you can still jump after walking off a ledge
    jumpBuffer: 0.25,     // seconds an early jump input is remembered
    spinBuffer: 0.30,     // seconds an early spin input is remembered
    ledgeAssist: 9,       // pixels: clip a ledge by this much and you are lifted onto it
  },

  /* ---------- HERO MOVEMENT -------------------------------------------- */
  hero: {
    runSpeed: 122,        // px/s at full finger-walk speed
    accel: 720, decel: 900, airAccel: 520, airDecel: 160,
    gravity: 700, maxFall: 300,
    jumpVel: 302,         // about 4 tiles high, 0.86 s in the air (time for open-close-open)
    doubleJumpVel: 282,
    stompBounce: 250, stompBounceHeld: 330,
    spinTime: 0.36,       // seconds the spin hits
    spinCooldown: 0.5,    // seconds between spins
    spinReach: 25,        // px to each side
    spinAirGravity: 0.55, // gravity scale while spinning in the air
    hurtKnock: 95, hurtHop: 190, hurtStun: 0.32,
  },

  /* ---------- DIFFICULTY ------------------------------------------------- */
  difficulty: {
    lives: 5,             // lives at the start of a course
    pips: 4,              // health pips
    invuln: 1.7,          // seconds of invincibility flashing after a hit
    enemySpeed: 1.0,      // multiplies every enemy's speed
    bossSpeed: 1.0,       // multiplies boss movement / shortens telegraphs when > 1
    bossWindow: 1.0,      // multiplies how long a boss stays vulnerable
    hurtShrink: 3,        // px shaved off enemy hit boxes when they would hurt you
    stompGrace: 9,        // px of extra height that still counts as landing on top
    quicksandSink: 15,    // px/s you sink in quicksand
    quicksandDepth: 20,   // px sunk before quicksand costs a pip and spits you out
    gustPush: 58,         // px/s a sandstorm gust pushes
    checkpointHeals: true // touching a new checkpoint refills health
  },

  score: { crystal: 100, enemy: 200, fruit: 1000, boss: 5000, timePar: 200, timeBonus: 15, lifeBonus: 500 },
};

/* #####################################################################
   2. UTILITIES + SAVE DATA
   ##################################################################### */
const clamp = (v, a, b) => v < a ? a : v > b ? b : v;
const lerp = (a, b, t) => a + (b - a) * t;
const approach = (v, target, step) => v < target ? Math.min(v + step, target) : Math.max(v - step, target);
const sign = v => v > 0 ? 1 : v < 0 ? -1 : 0;
const rnd = (a = 1, b) => b === undefined ? Math.random() * a : a + Math.random() * (b - a);
const now = () => performance.now();
// cheap deterministic noise for procedural art
function hash2(x, y) { let h = (x * 374761393 + y * 668265263) | 0; h = (h ^ (h >>> 13)) * 1274126177 | 0; return ((h ^ (h >>> 16)) >>> 0) / 4294967296; }
function mkCanvas(w, h) { const c = document.createElement('canvas'); c.width = w; c.height = h; return c; }

const SAVE_KEY = 'superspace.save.v1';
const Save = {
  data: null,
  defaults() {
    return {
      unlocked: { 'desert-1': true },
      best: {},            // best score per course
      highScore: 0,
      settings: {
        easyRun: false, music: true, sfx: true,
        actionSide: 'right',                 // which hand runs / jumps / attacks
        walkSens: TUNE.gesture.walkSens,
        swipeSens: TUNE.gesture.swipeSens,
        minScore: TUNE.gesture.minScore,
        holdFrames: TUNE.gesture.holdFrames,
        calibrated: false,
      },
    };
  },
  load() {
    const d = this.defaults();
    try {
      const raw = JSON.parse(localStorage.getItem(SAVE_KEY) || 'null');
      if (raw && typeof raw === 'object') {
        Object.assign(d.unlocked, raw.unlocked || {});
        Object.assign(d.best, raw.best || {});
        d.highScore = raw.highScore | 0;
        Object.assign(d.settings, raw.settings || {});
      }
    } catch (e) { /* private mode or corrupt save: start fresh */ }
    this.data = d;
    return d;
  },
  store() { try { localStorage.setItem(SAVE_KEY, JSON.stringify(this.data)); } catch (e) { /* storage unavailable */ } },
  reset() { try { localStorage.removeItem(SAVE_KEY); } catch (e) {} this.load(); },
};
Save.load();
const settings = () => Save.data.settings;

/* #####################################################################
   3. SOUND - effects and music, all synthesised with Web Audio
   ##################################################################### */
const Snd = (() => {
  let ac = null, master, sfxBus, musBus, noiseBuf;
  let song = null, songName = '', step = 0, nextT = 0, timer = 0;

  function init() {
    if (ac) return;
    const AC = window.AudioContext || window.webkitAudioContext;
    if (!AC) return;
    try { ac = new AC(); } catch (e) { ac = null; return; }
    master = ac.createGain(); master.gain.value = 0.9; master.connect(ac.destination);
    sfxBus = ac.createGain(); sfxBus.connect(master);
    musBus = ac.createGain(); musBus.connect(master);
    const n = ac.sampleRate, buf = ac.createBuffer(1, n, n), d = buf.getChannelData(0);
    for (let i = 0; i < n; i++) d[i] = Math.random() * 2 - 1;
    noiseBuf = buf;
    applySettings();
  }
  function applySettings() {
    if (!ac) return;
    sfxBus.gain.value = settings().sfx ? 1 : 0;
    musBus.gain.value = settings().music ? 0.55 : 0;
  }
  // Call from a tap / key press: browsers only start audio after a user action.
  function unlock() { init(); if (ac && ac.state !== 'running') ac.resume().catch(() => {}); }
  function suspend(on) { if (!ac) return; if (on) ac.suspend().catch(() => {}); else ac.resume().catch(() => {}); }

  function tone(type, f0, f1, dur, vol, when = 0, dest) {
    if (!ac) return;
    const t = ac.currentTime + when, o = ac.createOscillator(), g = ac.createGain();
    o.type = type; o.frequency.setValueAtTime(f0, t);
    if (f1) o.frequency.exponentialRampToValueAtTime(Math.max(20, f1), t + dur);
    g.gain.setValueAtTime(0.0001, t);
    g.gain.linearRampToValueAtTime(vol, t + 0.006);
    g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    o.connect(g); g.connect(dest || sfxBus);
    o.start(t); o.stop(t + dur + 0.03);
  }
  function hiss(dur, vol, f0, f1, q = 1, when = 0, type = 'bandpass', dest) {
    if (!ac) return;
    const t = ac.currentTime + when, s = ac.createBufferSource(), f = ac.createBiquadFilter(), g = ac.createGain();
    s.buffer = noiseBuf; s.loop = true;
    f.type = type; f.Q.value = q; f.frequency.setValueAtTime(f0, t);
    if (f1) f.frequency.exponentialRampToValueAtTime(Math.max(20, f1), t + dur);
    g.gain.setValueAtTime(0.0001, t);
    g.gain.linearRampToValueAtTime(vol, t + Math.min(0.02, dur * 0.3));
    g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    s.connect(f); f.connect(g); g.connect(dest || sfxBus);
    s.start(t, Math.random() * 0.5); s.stop(t + dur + 0.03);
  }
  const N = (n) => 440 * Math.pow(2, (n - 69) / 12);          // midi -> Hz
  const seq = (type, notes, stepDur, vol, dest) => notes.forEach((n, i) => { if (n) tone(type, N(n), 0, stepDur * 1.6, vol, i * stepDur, dest); });

  const FX = {
    jump:   () => tone('square', 260, 620, 0.17, 0.11),
    djump:  () => { tone('square', 420, 880, 0.13, 0.1); tone('square', 660, 1320, 0.14, 0.08, 0.07); },
    spin:   () => { hiss(0.3, 0.2, 500, 2600, 1.4); tone('sawtooth', 200, 520, 0.26, 0.05); },
    stomp:  () => { tone('square', 320, 80, 0.13, 0.16); hiss(0.09, 0.2, 1600, 500, 0.8); },
    pop:    () => { tone('triangle', 700, 140, 0.16, 0.2); hiss(0.07, 0.12, 2400, 900, 0.8); },
    hurt:   () => { tone('sawtooth', 420, 90, 0.34, 0.16); tone('square', 210, 60, 0.3, 0.08); },
    die:    () => seq('square', [76, 72, 69, 64, 60, 57, 52], 0.085, 0.11),
    crystal:() => { tone('square', 1318, 0, 0.07, 0.07); tone('square', 1976, 0, 0.12, 0.07, 0.055); },
    fruit:  () => seq('square', [72, 76, 79, 84, 88, 91], 0.06, 0.1),
    life:   () => seq('square', [76, 79, 88, 84, 86, 91], 0.09, 0.1),
    check:  () => seq('triangle', [67, 72, 76, 79, 84], 0.07, 0.2),
    land:   () => hiss(0.07, 0.1, 500, 200, 0.7, 0, 'lowpass'),
    clank:  () => { tone('square', 190, 150, 0.07, 0.12); hiss(0.05, 0.12, 4000, 3000, 2); },
    gust:   () => hiss(2.6, 0.16, 250, 1100, 0.5),
    gustWarn: () => hiss(1.0, 0.07, 900, 300, 0.8),
    quick:  () => hiss(0.18, 0.08, 300, 120, 1, 0, 'lowpass'),
    rumble: () => { hiss(1.0, 0.4, 90, 55, 0.7, 0, 'lowpass'); tone('sine', 55, 40, 0.9, 0.2); },
    warn:   () => { tone('square', 880, 0, 0.07, 0.08); tone('square', 880, 0, 0.07, 0.08, 0.14); },
    erupt:  () => { hiss(0.5, 0.36, 300, 1800, 0.6); tone('sawtooth', 70, 240, 0.4, 0.14); },
    roar:   () => { tone('sawtooth', 130, 52, 0.9, 0.2); tone('square', 98, 40, 0.9, 0.1); hiss(0.9, 0.12, 700, 250, 1.2); },
    slam:   () => { hiss(0.45, 0.5, 260, 50, 0.5, 0, 'lowpass'); tone('sine', 90, 30, 0.4, 0.4); },
    spit:   () => { tone('square', 500, 160, 0.2, 0.12); hiss(0.14, 0.15, 900, 400, 1); },
    bossHit:() => { tone('square', 240, 45, 0.5, 0.2); hiss(0.3, 0.3, 1400, 200, 0.7); seq('square', [84, 79, 72], 0.07, 0.08); },
    boom:   () => { hiss(0.55, 0.45, 500, 50, 0.4, 0, 'lowpass'); tone('sine', 110, 30, 0.5, 0.3); },
    move:   () => tone('square', 620, 0, 0.045, 0.06),
    ok:     () => { tone('square', 620, 0, 0.06, 0.07); tone('square', 930, 0, 0.1, 0.07, 0.06); },
    back:   () => { tone('square', 520, 0, 0.06, 0.07); tone('square', 390, 0, 0.1, 0.07, 0.06); },
    pause:  () => { tone('square', 660, 0, 0.08, 0.08); tone('square', 440, 0, 0.12, 0.08, 0.09); },
    turn:   () => tone('triangle', 480, 720, 0.06, 0.08),
    tick:   () => tone('square', 1500, 0, 0.03, 0.05),
    lit:    () => tone('triangle', 880, 1320, 0.08, 0.08),
    clear:  () => seq('square', [64, 68, 71, 76, 0, 71, 76, 0, 80, 0, 83, 0, 88, 88], 0.11, 0.11),
    over:   () => seq('triangle', [64, 0, 60, 0, 57, 0, 53, 52, 52], 0.17, 0.22),
  };
  function sfx(name) { if (!ac || ac.state !== 'running') return; const f = FX[name]; if (f) f(); }

  /* ----- music: tiny step sequencer. Notes are "E4:2" = pitch:length in 16ths, "-" = rest ----- */
  const SEMI = { C: 0, D: 2, E: 4, F: 5, G: 7, A: 9, B: 11 };
  function parse(str) {
    const out = []; let pos = 0;
    for (const tok of str.trim().split(/\s+/)) {
      const [name, lenS] = tok.split(':'); const len = lenS ? +lenS : 2;
      if (name !== '-') {
        const m = /^([A-G])([#b]?)(\d)$/.exec(name);
        const midi = SEMI[m[1]] + (m[2] === '#' ? 1 : m[2] === 'b' ? -1 : 0) + 12 * (+m[3] + 1);
        out.push({ at: pos, midi, len });
      }
      pos += len;
    }
    out.total = pos;
    return out;
  }
  // bass in a 3-3-2 pulse on a root note: "E2" -> six notes over one bar
  const pulse = (root, alt) => `${root}:3 ${root}:3 ${alt || root}:2 ${root}:3 ${root}:3 ${alt || root}:2`;
  const half = (a, b) => `${a}:3 ${a}:3 ${a}:2 ${b}:3 ${b}:3 ${b}:2`;
  const arp = (a, b, c) => `${a} ${b} ${c} ${b} ${a} ${b} ${c} ${b}`;
  const drums = (bars, k, s, h) => ({ bars, k, s, h });

  const SONGS = {
    // E Phrygian dominant: the "desert" scale
    desert: {
      bpm: 108,
      lead: parse(`E4:2 E4:1 F4:1 G#4:2 A4:2 B4:3 A4:1 G#4:2 F4:2
                   E4:4 -:2 E4:1 F4:1 G#4:2 F4:2 E4:4
                   E4:2 E4:1 F4:1 G#4:2 A4:2 B4:3 C5:1 B4:2 A4:2
                   G#4:4 A4:2 G#4:2 F4:2 E4:6
                   A4:2 B4:2 C5:4 B4:2 A4:2 G#4:4
                   A4:2 B4:2 C5:2 D5:2 E5:6 -:2
                   D5:2 C5:2 B4:2 A4:2 G#4:2 A4:2 B4:4
                   A4:2 G#4:2 F4:2 G#4:2 E4:6 -:2`),
      bass: parse([pulse('E2', 'E3'), half('F2', 'E2'), pulse('E2', 'E3'), half('F2', 'E2'),
                   pulse('A2', 'A3'), pulse('A2', 'A3'), half('D2', 'E2'), half('F2', 'E2')].join(' ')),
      arp: parse([arp('E3', 'G#3', 'B3'), arp('F3', 'A3', 'C4'), arp('E3', 'G#3', 'B3'), arp('F3', 'A3', 'C4'),
                  arp('A3', 'C4', 'E4'), arp('A3', 'C4', 'E4'), arp('D3', 'F3', 'A3'), arp('E3', 'G#3', 'B3')].join(' ')),
      drums: drums(8, [0, 6, 8, 11], [4, 12], [0, 3, 6, 8, 11, 14]),
      leadVol: 0.075, bassVol: 0.2, arpVol: 0.028,
    },
    boss: {
      bpm: 146,
      lead: parse(`E5:2 E5:2 F5:2 E5:2 D5:2 E5:2 B4:4
                   E5:2 E5:2 F5:2 E5:2 G#5:2 F5:2 E5:4
                   A5:2 G#5:2 F5:2 E5:2 F5:2 E5:2 D5:2 C5:2
                   B4:2 C5:2 D5:2 F5:2 E5:6 -:2`),
      bass: parse(`E2 E2 E3 E2 E2 E2 E3 E2  E2 E2 E3 E2 F2 F2 F3 F2
                   A2 A2 A3 A2 F2 F2 F3 F2  B2 B2 C3 C3 D3 D3 E3 E3`),
      arp: parse([arp('E4', 'G#4', 'B4'), arp('E4', 'G#4', 'B4'), arp('A3', 'C4', 'F4'), arp('B3', 'D4', 'G#4')].join(' ')),
      drums: drums(4, [0, 4, 8, 10, 12], [4, 12], [0, 2, 4, 6, 8, 10, 12, 14]),
      leadVol: 0.07, bassVol: 0.2, arpVol: 0.03,
    },
    title: {
      bpm: 92,
      lead: parse(`E4:4 B4:4 A4:2 G#4:2 E4:4
                   F4:4 C5:4 B4:2 A4:2 F4:4
                   E4:4 B4:4 E5:4 D5:2 C5:2
                   B4:6 A4:2 G#4:8`),
      bass: parse(`E2:8 E2:8 F2:8 F2:8 A2:8 A2:8 E2:8 E2:8`),
      arp: parse([arp('E3', 'G#3', 'B3'), arp('F3', 'A3', 'C4'), arp('A3', 'C4', 'E4'), arp('E3', 'G#3', 'B3')].join(' ')),
      drums: drums(4, [0], [8], [0, 4, 8, 12]),
      leadVol: 0.06, bassVol: 0.18, arpVol: 0.04,
    },
  };
  for (const s of Object.values(SONGS)) {

/* ---------- backdrops: each world paints its own parallax layers ---------- */
const BG_W = 512;
const BAYER = [0, 8, 2, 10, 12, 4, 14, 6, 3, 11, 1, 9, 15, 7, 13, 5].map(v => (v + 0.5) / 16);
const hex = (h) => [parseInt(h.slice(1, 3), 16), parseInt(h.slice(3, 5), 16), parseInt(h.slice(5, 7), 16)];
function paintSky(stops, bands) {
  // vertical gradient quantised into bands with ordered dithering, the 16-bit way
  const c = mkCanvas(BG_W, VIEW_H), g = c.getContext('2d'), im = g.createImageData(BG_W, VIEW_H), d = im.data;
  const colAt = (t) => {
    let i = 0; while (i < stops.length - 2 && t > stops[i + 1][0]) i++;
    const a = stops[i], b = stops[i + 1], k = clamp((t - a[0]) / (b[0] - a[0]), 0, 1), ca = hex(a[1]), cb = hex(b[1]);
    return [lerp(ca[0], cb[0], k), lerp(ca[1], cb[1], k), lerp(ca[2], cb[2], k)];
  };
  const pal = []; for (let i = 0; i <= bands; i++) pal.push(colAt(i / bands));
  for (let y = 0; y < VIEW_H; y++) for (let x = 0; x < BG_W; x++) {
    const v = y / VIEW_H * bands + (BAYER[(y & 3) * 4 + (x & 3)] - 0.5);
    const col = pal[clamp(Math.round(v), 0, bands)], i = (y * BG_W + x) * 4;
    d[i] = col[0]; d[i + 1] = col[1]; d[i + 2] = col[2]; d[i + 3] = 255;
  }
  g.putImageData(im, 0, 0);
  return c;
}
// silhouette layer from a height function (seamless over BG_W)
function paintRidge(hfn, light, base, shade, edge) {
  const p = new Pix(BG_W, VIEW_H);
  for (let x = 0; x < BG_W; x++) {
    const y = Math.round(hfn(x)), slope = hfn(x + 2) - hfn(x - 2);
    p.rect(x, y, 1, VIEW_H - y, base);
    const face = slope > 0.35 ? shade : slope < -0.35 ? light : null;
    if (face) for (let k = 1; k < 26; k++) if (hash2(x, k) > k / 26) p.px(x, y + k, face);
    p.px(x, y, edge);
  }
  return p.c;
}
const Backdrops = {
  desert() {
    const sky = paintSky([[0, '#1c1140'], [0.22, '#3d1d5e'], [0.42, '#7d2c6e'], [0.58, '#c9486b'], [0.72, '#f5855c'], [0.84, '#ffc078'], [1, '#ffe4a6']], 15);
    const p = new Pix(BG_W, VIEW_H); p.g.drawImage(sky, 0, 0);
    for (let i = 0; i < 90; i++) {   // stars
      const x = Math.floor(hash2(i, 11) * BG_W), y = Math.floor(hash2(i, 23) * hash2(i, 5) * 120);
      p.px(x, y, hash2(i, 3) > 0.7 ? '#fff' : '#c9a8f0'); if (hash2(i, 9) > 0.9) p.rect(x - 1, y, 3, 1, '#fff').rect(x, y - 1, 1, 3, '#fff');
    }
    // ringed gas giant: back of the ring, the planet, then the front of the ring
    const px = 372, py = 70, R = 31;
    const ring = (front) => {
      for (let x = px - 52; x < px + 52; x++) {
        const k = 1 - ((x + 0.5 - px) / 52) ** 2; if (k <= 0) continue;
        const yo = 9 * Math.sqrt(k), ki = 1 - ((x + 0.5 - px) / 43) ** 2, yi = ki > 0 ? 5.5 * Math.sqrt(ki) : 0, th = Math.max(1, Math.round(yo - yi));
        if (front) p.rect(x, Math.round(py + yi), 1, th, '#f6dca8'); else p.rect(x, Math.round(py - yo), 1, th, '#c9a67e');
      }
    };
    ring(false);
    p.ell(px, py, R, R, '#a57cc0'); p.ell(px - 3, py - 3, R - 4, R - 4, '#e6c8ee');
    p.atop(q => { q.ell(px - 10, py - 12, 14, 4, '#f6e4f8'); q.ell(px + 4, py + 6, 22, 3, '#c9a2dc'); q.ell(px - 6, py + 16, 16, 2.5, '#c9a2dc'); });

    // far mesas, mid dunes, near dunes
    const mesas = [[10, 80, 40], [112, 46, 62], [176, 96, 32], [296, 64, 54], [378, 104, 36], [488, 44, 46]];
    const far = paintRidge((x) => {

      for (const [mx, mw, mh] of mesas) for (const o of [0, -BG_W]) { const d = x - (mx + o); if (d > -8 && d < mw + 8) h = Math.max(h, mh * clamp(Math.min(d + 8, mw + 8 - d) / 8, 0, 1) + (hash2(Math.floor(d / 6), mh) - 0.5) * 3); }

    return [{ c: p.c, f: 0.02 }, { c: far, f: 0.1 }, { c: mid, f: 0.26 }, { c: near, f: 0.5 }];

};

const T_EMPTY = 0, T_SOLID = 1, T_ONEWAY = 2, T_SLOPE = 3, T_QUICK = 4;

// ---- map characters: terrain -------------------------------------------
// Ground ("#" and the slopes) is filled downward automatically, so a map
// only has to draw the surface line. hl / hr = slope height at the tile's
// left / right edge, in pixels.
const TILES = {
  '#': { k: T_SOLID, ground: true },
  '(': { k: T_SLOPE, ground: true, hl: 0, hr: 16 },   // steep up
  ')': { k: T_SLOPE, ground: true, hl: 16, hr: 0 },   // steep down
  'a': { k: T_SLOPE, ground: true, hl: 0, hr: 8 },    // gentle up, lower half
  'b': { k: T_SLOPE, ground: true, hl: 8, hr: 16 },   // gentle up, upper half
  'd': { k: T_SLOPE, ground: true, hl: 16, hr: 8 },   // gentle down, upper half
  'e': { k: T_SLOPE, ground: true, hl: 8, hr: 0 },    // gentle down, lower half
  'R': { k: T_SOLID, block: true },                   // ruin block (solid, floats)
  '=': { k: T_ONEWAY },                               // ruin slab (jump up through it)
  '~': { k: T_QUICK },                                // quicksand, two tiles deep

/* ---------- level: tiles, collision queries, pre-painted terrain ---------- */
class Level {
  constructor(course) {
    this.course = course; this.world = WORLDS[course.world];
    const H = this.h = course.rows || 17, base = course.base || 14, segX = [];
    let W = 0;
    for (const s of course.segments) { segX.push(W); W += Math.max(...s.rows.map(r => r.length)); }
    this.w = W; this.pxW = W * TS; this.pxH = H * TS; this.pitY = base * TS + 3;
    this.k = new Uint8Array(W * H); this.hl = new Uint8Array(W * H); this.hr = new Uint8Array(W * H);
    this.gnd = new Uint8Array(W * H); this.blk = new Uint8Array(W * H);
    this.things = []; this.zones = []; this.arena = null;
    const ch = new Array(W * H).fill(' ');
    course.segments.forEach((s, si) => {
      const n = s.rows.length;
      s.rows.forEach((row, j) => {
        const r = base - (n - 1) + j;
        for (let i = 0; i < row.length; i++) {
          const c = segX[si] + i, v = row[i];
          if (v === ' ' || r < 0 || r >= H) continue;
          if (TILES[v]) ch[r * W + c] = v;
          else if (THINGS[v]) this.things.push(Object.assign({ c, r, x: c * TS + 8, y: (r + 1) * TS }, THINGS[v]));
          else console.warn('SUPERSPACE: unknown map character "' + v + '" in', course.id);
        }
      });
      for (const z of s.zones || []) this.zones.push(Object.assign({}, z, { x0: (segX[si] + z.from) * TS, x1: (segX[si] + z.to) * TS, on: 0, k: 0, state: 'calm' }));
    });
    // fill ground downward; quicksand is two tiles deep with ground below
    for (let c = 0; c < W; c++) {
      let fill = false, quick = 0;
      for (let r = 0; r < H; r++) {
        const i = r * W + c;
        if (fill) ch[i] = '#';
        else if (quick > 0) { ch[i] = '~'; if (--quick === 0) fill = true; }
        else if (TILES[ch[i]] && TILES[ch[i]].ground) fill = true;
        else if (ch[i] === '~') quick = 1;
        const t = TILES[ch[i]];
        if (t) { this.k[i] = t.k; this.hl[i] = t.hl || 0; this.hr[i] = t.hr || 0; this.gnd[i] = t.ground ? 1 : 0; this.blk[i] = t.block ? 1 : 0; }
      }
    }
    this.ch = ch;
    const a0 = this.things.find(t => t.arena === 0), a1 = this.things.find(t => t.arena === 1);
    if (a0 && a1) this.arena = { x0: a0.c * TS, x1: a1.c * TS, y: (a0.r + 1) * TS };
    this.start = this.things.find(t => t.start) || { x: 40, y: (base) * TS };
    this.paint();
  }
  kind(c, r) {
    if (c < 0 || c >= this.w) return T_SOLID;         // the level has side walls
    if (r < 0 || r >= this.h) return T_EMPTY;         // open sky above, open pit below
    return this.k[r * this.w + c];
  }
  kindAt(x, y) { return this.kind(Math.floor(x / TS), Math.floor(y / TS)); }
  slopeY(c, r, x) {
    const i = r * this.w + c, t = clamp((x - c * TS) / TS, 0, 1);
    return (r + 1) * TS - (this.hl[i] + (this.hr[i] - this.hl[i]) * t);
  }
  // first standable surface at x, at or below yFrom (within maxDist). null if none.
  surfaceBelow(x, yFrom, maxDist = 64) {
    const c = Math.floor(x / TS);
    for (let r = Math.floor(yFrom / TS); r <= Math.floor((yFrom + maxDist) / TS); r++) {
      const k = this.kind(c, r);
      if (k === T_SOLID || k === T_ONEWAY) return Math.max(r * TS, yFrom);
      if (k === T_SLOPE) { const sy = this.slopeY(c, r, x); if (sy >= yFrom - 0.01) return sy; return yFrom; }
    }
    return null;
  }
  // top of the quicksand at x if (x, y) is inside quicksand, else null
  quickTop(x, y) {
    const c = Math.floor(x / TS); let r = Math.floor(y / TS);
    if (this.kind(c, r) !== T_QUICK) return null;
    while (this.kind(c, r - 1) === T_QUICK) r--;
    return r * TS + 3;
  }
  // where a body moving down from prevY to maxY comes to rest, or null
  landing(b, yMin, yMax, prevY) {
    const cc = Math.floor(b.x / TS), r0 = Math.floor(yMin / TS), r1 = Math.floor(yMax / TS), hw = b.w / 2;
    for (let r = r0; r <= r1; r++) {              // slopes are followed by the body's centre
      if (this.kind(cc, r) === T_SLOPE) { const sy = this.slopeY(cc, r, b.x); if (sy >= yMin && sy <= yMax) return sy; }
    }
    let best = null;
    for (const sx of [b.x - hw + 1.5, b.x, b.x + hw - 1.5]) {
      const c = Math.floor(sx / TS);
      for (let r = r0; r <= r1; r++) {
        const k = this.kind(c, r), top = r * TS;
        if (k === T_SOLID) { if (top >= yMin && top <= yMax && this.kind(c, r - 1) !== T_SOLID) { if (best === null || top < best) best = top; break; } }
        else if (k === T_ONEWAY) { if (top >= prevY - 1.5 && top <= yMax) { if (best === null || top < best) best = top; break; } }
      }
    }
    return best;
  }
  /* Paint the terrain once into wide strips. The ground is drawn per pixel
     from the surface line down, so dunes come out as smooth shaded curves. */
  paint() {
    const W = this.pxW, H = this.pxH, surf = new Float32Array(W);
    for (let x = 0; x < W; x++) {
      const c = x >> 4; let s = Infinity;
      for (let r = 0; r < this.h; r++) { const i = r * this.w + c; if (this.gnd[i]) { s = this.k[i] === T_SLOPE ? this.slopeY(c, r, x + 0.5) : r * TS; break; } }
      surf[x] = s;
    }
    this.surf = surf;
    const pal = this.world.ground.map(hex), last = pal.length - 1, CW = 256;
    this.chunks = [];
    for (let x0 = 0; x0 < W; x0 += CW) {
      const cw = Math.min(CW, W - x0), cv = mkCanvas(cw, H), g = cv.getContext('2d'), im = g.createImageData(cw, H), d = im.data;
      for (let lx = 0; lx < cw; lx++) {
        const x = x0 + lx, s = surf[x]; if (s === Infinity) continue;
        const top = Math.floor(s), slope = surf[Math.min(W - 1, x + 2)] - surf[Math.max(0, x - 2)];
        const sl = surf[Math.max(0, x - 3)], sr = surf[Math.min(W - 1, x + 3)];
        for (let y = Math.max(0, top); y < H; y++) {
          const depth = y - top, n = hash2(x, y); let idx;
          if (depth < 1) idx = 0; else if (depth < 3) idx = 1;
          else {
            const dd = depth + (n - 0.5) * 7;
            idx = dd < 12 ? 2 : dd < 25 ? 3 : dd < 42 ? 4 : 5;
            if (depth < 22 && (depth + Math.round(Math.sin(x * 0.21) * 2)) % 6 === 0 && hash2(x >> 3, depth) > 0.3) idx++;    // wind ripples
            if (depth > 26 && (y + Math.round(Math.sin(x * 0.05) * 3)) % 11 === 0) idx++;                                   // strata
            if (n > 0.975) idx--;
          }
          if (isFinite(slope) && depth >= 1) {                       // sun from the left: lee sides fall into shade
            if (slope > 1 && depth < 18 && n > depth / 18) idx++;
            else if (slope < -1 && depth >= 3 && depth < 10 && n > depth / 10) idx--;
          }
          if (sr > y + 3) idx += 2; else if (sl > y + 3 && depth > 0) idx--;   // cliff faces
          const col = pal[clamp(idx, depth < 1 ? 0 : 1, last)], i = (y * cw + lx) * 4;
          d[i] = col[0]; d[i + 1] = col[1]; d[i + 2] = col[2]; d[i + 3] = 255;
        }
      }
      g.putImageData(im, 0, 0);
      for (let c = x0 >> 4; c < (x0 + cw + 15) >> 4 && c < this.w; c++) for (let r = 0; r < this.h; r++) {
        const i = r * this.w + c, px = c * TS - x0, py = r * TS;
        if (this.blk[i]) g.drawImage(SPR.tiles.block[Math.floor(hash2(c, r) * 2.2 + (hash2(c * 3, r * 5) > 0.86 ? 2 : 0)) % 4], px, py);
        else if (this.k[i] === T_ONEWAY) {
          const l = this.kind(c - 1, r) !== T_ONEWAY, rr = this.kind(c + 1, r) !== T_ONEWAY;
          g.drawImage(SPR.tiles.slab[l && rr ? 'lr' : l ? 'l' : rr ? 'r' : 'm'], px, py);
        }
      }
      this.chunks.push({ c: cv, x: x0 });
    }
  }
}

/* ---------- body physics shared by the hero and walking enemies ----------
   A body is { x, y (feet), w, h, vx, vy, onGround }. */
function moveBody(L, b, dt) {
  const hw = b.w / 2, STEP = TUNE.feel.ledgeAssist;
  b.hitWall = 0;
  // sideways: walls stop the body, but its bottom STEP pixels are ignored so
  // it walks up slopes and gets lifted onto ledges it only just clips
  const px = b.x; let nx = b.x + b.vx * dt;
  const dir = nx > px ? 1 : nx < px ? -1 : 0;
  if (dir) {
    const c = Math.floor((nx + dir * hw) / TS), top = b.y - b.h + 1, bot = Math.max(top, b.y - STEP);
    for (let r = Math.floor(top / TS); r <= Math.floor(bot / TS); r++) {
      if (L.kind(c, r) === T_SOLID) { nx = dir > 0 ? c * TS - hw - 0.001 : (c + 1) * TS + hw + 0.001; b.vx = 0; b.hitWall = dir; break; }
    }
  }
  b.x = nx;
  // up / down
  const py = b.y, was = b.onGround; let ny = b.y + b.vy * dt;
  b.onGround = false;
  if (b.vy < 0) {
    const r = Math.floor((ny - b.h) / TS);
    for (let c = Math.floor((b.x - hw + 1) / TS); c <= Math.floor((b.x + hw - 1) / TS); c++) {
      if (L.kind(c, r) === T_SOLID) { ny = (r + 1) * TS + b.h; b.vy = 0; break; }
    }
    b.y = ny;
  } else {
    const s = L.landing(b, py - STEP, ny + (was ? 7 : 0), py);
    if (s !== null) { b.y = s; b.vy = 0; b.onGround = true; } else b.y = ny;
  }
  // never end up inside a slope
  const cc = Math.floor(b.x / TS), rr = Math.floor((b.y - 0.01) / TS);
  if (L.kind(cc, rr) === T_SLOPE) {
    const sy = L.slopeY(cc, rr, b.x);
    if (b.y > sy + 0.01) {
      if (b.y - sy <= STEP + 4) { b.y = sy; if (b.vy > 0) b.vy = 0; b.onGround = b.vy >= 0; }
      else { b.x = px; b.vx = 0; b.hitWall = dir; }
    }
  }
}

/* ---------- enemies (data + behaviour). Flags the engine reads each frame:
     hazard    - touching it hurts          stompable - landing on it defeats it
     spinnable - a spin attack defeats it   hidden    - cannot be touched at all  ---------- */
const ENEMIES = {
  // Sand grub: creeps under the sand as a little mound, pops up near the hero.
  grub: {
    w: 14, h: 17, score: 200,
    P: { range: 44, creep: 15, trigger: 122, warn: 0.8, rise: 0.22, up: 2.8, sink: 0.3, rest: 1.5 },   // slow + telegraphed
    init(e) { e.state = 'hidden'; e.t = rnd(0.1, 0.8); e.ext = 0; e.hidden = true; e.hazard = e.stompable = e.spinnable = false; },
    update(e, dt, G) {
      const P = this.P, h = G.hero, sp = TUNE.difficulty.enemySpeed;
      e.t -= dt; e.anim += dt;
      if (e.state === 'hidden') {
        const nx = approach(e.x, clamp(h.x, e.homeX - P.range, e.homeX + P.range), P.creep * sp * dt);
        const gy = G.L.surfaceBelow(nx, e.y - 8, 16);
        e.moving = false;
        if (gy !== null && Math.abs(gy - e.y) <= 4 && G.L.kindAt(nx, gy + 2) !== T_ONEWAY && nx !== e.x) { e.x = nx; e.y = gy; e.moving = true; }
        if (e.t <= 0 && Math.abs(h.x - e.x) < P.trigger && !h.dead) { e.state = 'warn'; e.t = P.warn; }
      } else if (e.state === 'warn') {
        if (Math.random() < dt * 30) G.dust(e.x + rnd(-8, 8), e.y - 2, 1, G.world.ground[1]);
        if (e.t <= 0) { e.state = 'rise'; e.t = P.rise; e.hidden = false; G.dust(e.x, e.y - 2, 8, G.world.ground[1]); if (G.onScreen(e.x)) Snd.sfx('quick'); }
      } else if (e.state === 'rise') {
        e.ext = 1 - Math.max(0, e.t) / P.rise;
        if (e.t <= 0) { e.state = 'up'; e.t = P.up; e.ext = 1; e.hazard = e.stompable = e.spinnable = true; }
      } else if (e.state === 'up') {
        if (e.t <= 0) { e.state = 'sink'; e.t = P.sink; e.hazard = e.stompable = e.spinnable = false; }
      } else if (e.state === 'sink') {
        e.ext = Math.max(0, e.t) / P.sink;
        if (e.t <= 0) { e.state = 'hidden'; e.t = P.rest; e.ext = 0; e.hidden = true; }
      }
    },
    draw(e, ctx) {
      if (e.state === 'hidden' || e.state === 'warn') {

/* ---------- bosses. Each type has per-tier numbers; tier 2 is the harder rematch.

const BOSSES = {
  sandworm: {
    name: 'MAWRA THE DUNE WORM',

      2: { hp: 3, prowl: 1.6, prowlSpeed: 96, warn: 0.75, hold: 0.4, sway: 0.55, stuck: 2.6, reach: 124, height: 122, spit: 4, spitWarn: 0.9, shock: true },
    },

class Sandworm {

    this.hp = this.maxHp = P.hp; this.gy = arena.y; this.dead = false;
    this.x = arena.x0 + (arena.x1 - arena.x0) * 0.7;      // where the worm's hole is

    this.state = 'intro'; this.t = 0; this.flash = 0; this.vulnerable = false; this.out = false; this.danger = false;
    this.cycle = 0; this.shots = []; this.marks = []; this.cue = {}; this.told = false;

  go(state) { this.state = state; this.t = 0; this.cue = {}; this.rx = this.hx; this.ry = this.hy; }

/* ---------- input: keyboard + gestures (+ touch buttons) feed one control object ---------- */
const Input = {
  keys: new Set(), edges: new Set(), lastDir: 0,
  touch: { left: false, right: false, jump: false, spin: false },
  ctl: { run: 0, face: 0, jump: false, spin: false, held: false, sticky: false },
  down(code) { if (!this.keys.has(code)) this.edges.add(code); this.keys.add(code); if (LEFT.has(code)) this.lastDir = -1; if (RIGHT.has(code)) this.lastDir = 1; },
  up(code) { this.keys.delete(code); },
  any(set) { for (const k of set) if (this.keys.has(k)) return true; return false; },
  edge(set) { for (const k of set) if (this.edges.has(k)) return true; return false; },
  // called once per game step; `gest` is the gesture snapshot for this step (or null)
  poll(gest) {
    const c = this.ctl, t = this.touch;
    const l = this.any(LEFT) || t.left, r = this.any(RIGHT) || t.right;
    c.face = l && r ? this.lastDir : l ? -1 : r ? 1 : 0;
    c.run = l || r ? 1 : 0; c.sticky = false;
    c.jump = this.edge(JUMP) || t.jumpEdge; c.spin = this.edge(SPIN) || t.spinEdge;
    c.held = this.any(JUMP) || t.jump;
    t.jumpEdge = t.spinEdge = false;
    if (gest) {
      if (gest.run > c.run) { c.run = gest.run; c.sticky = true; }
      if (gest.face) c.face = gest.face;
      c.jump = c.jump || gest.jump; c.spin = c.spin || gest.spin; c.held = c.held || gest.palm;
    }
    this.edges.clear();
    return c;
  },
};
const LEFT = new Set(['ArrowLeft', 'KeyA']), RIGHT = new Set(['ArrowRight', 'KeyD']);
const JUMP = new Set(['Space', 'ArrowUp', 'KeyW', 'KeyZ']), SPIN = new Set(['KeyX', 'KeyC', 'ShiftLeft', 'ShiftRight']);

/* ---------- the game ---------- */
const levelCache = {}, bgCache = {};
const Game = {
  active: false, course: null, world: null, L: null, hero: null,
  enemies: [], pickups: [], checks: [], props: [], parts: [], pops: [], corpses: [],
  boss: null, bossOn: false, bossDone: false,
  cam: { x: 0, y: 0 }, shakeT: 0, shakeA: 0,
  score: 0, crystals: 0, crystalsTotal: 0, lives: 0, time: 0, fruit: false,
  state: 'play', stateT: 0, hint: null, hintT: 0, banner: null, shadeK: 1, windNow: 0,

  start(id) {
    const course = COURSES.find(c => c.id === id);
    this.course = course; this.world = WORLDS[course.world];
    this.L = levelCache[id] || (levelCache[id] = new Level(course));
    this.bg = bgCache[this.world.backdrop] || (bgCache[this.world.backdrop] = Backdrops[this.world.backdrop]());
    this.score = 0; this.crystals = 0; this.lives = TUNE.difficulty.lives; this.time = 0; this.fruit = false;
    this.taken = new Set(); this.checkAt = -1; this.respawnAt = { x: this.L.start.x, y: this.L.start.y };
    this.crystalsTotal = this.L.things.filter(t => t.pickup === 'crystal').length;
    this.bossDone = false; this.active = true;
    this.populate();
    this.cam.x = clamp(this.hero.x - VIEW_W * 0.4, 0, this.L.pxW - VIEW_W); this.cam.y = this.L.pxH - VIEW_H;
    this.banner = { a: courseLabel(course), b: course.name, t: 3 };
    Snd.music(this.world.music);
  },
  // (re)create everything that resets when a life is lost
  populate() {
    const L = this.L, D = TUNE.difficulty;
    const gy = L.surfaceBelow(this.respawnAt.x, this.respawnAt.y - 20, 80);
    this.hero = {
      x: this.respawnAt.x, y: gy === null ? this.respawnAt.y : gy, vx: 0, vy: 0, w: 12, h: 24, facing: 1, onGround: false,
      coyote: 0, jumpBuf: 0, spinBuf: 0, airJumps: 0, spinT: 0, spinCd: 0, spinHit: new Set(), invuln: 1, stun: 0,
      pips: D.pips, dead: false, carry: 0, landT: 9, anim: 0, runPhase: 0, inQuick: false, combo: 0, hitWall: 0,
    };
    this.enemies = []; this.pickups = []; this.props = []; this.parts = []; this.pops = []; this.corpses = [];
    const checks = [];
    L.things.forEach((t, i) => {
      if (t.enemy) {
        const def = ENEMIES[t.enemy], y = L.surfaceBelow(t.x, t.y - 16, 64);
        const e = { type: t.enemy, def, x: t.x, y: y === null ? t.y : y, homeX: t.x, vx: 0, vy: 0, w: def.w, h: def.h, dir: -1, t: 0, anim: rnd(3), alive: true, onGround: false, hidden: false, hazard: true, stompable: false, spinnable: false };
        def.init(e); this.enemies.push(e);
      } else if (t.pickup) { if (!this.taken.has(i)) this.pickups.push({ id: i, kind: t.pickup, x: t.x, y: t.y - 8, ph: (t.c * 0.7) % 6.28 }); }
      else if (t.checkpoint) checks.push({ x: t.x, y: L.surfaceBelow(t.x, t.y - 16, 64) || t.y, on: false });
      else if (t.prop) this.props.push({ kind: t.prop, x: t.x, y: (L.surfaceBelow(t.x, t.y - 16, 64) || t.y) + 1, v: (t.c * 7) % 2 });
    });
    checks.sort((a, b) => a.x - b.x).forEach((c, i) => { c.i = i; c.on = i <= this.checkAt; });
    this.checks = checks;
    this.boss = null; this.bossOn = false; this.state = 'play'; this.stateT = 0; this.hint = null; this.shadeK = 1;
    for (const z of L.zones) { z.state = 'calm'; z.k = 0; }
    Snd.duck(false);
    if (!this.bossDone) Snd.music(this.world.music);
  },
  onScreen(x, m = 40) { return x > this.cam.x - m && x < this.cam.x + VIEW_W + m; },

  /* ----- effects ----- */
  part(x, y, vx, vy, life, col, size = 1, grav = 0) { if (this.parts.length < 400) this.parts.push({ x, y, vx, vy, life, max: life, col, size, grav }); },
  dust(x, y, n, col) { for (let i = 0; i < n; i++) this.part(x + rnd(-4, 4), y, rnd(-30, 30), rnd(-50, -8), rnd(0.25, 0.6), col, rnd() < 0.4 ? 2 : 1, 120); },
  burst(x, y, n, col) { for (let i = 0; i < n; i++) { const a = rnd(6.28), s = rnd(30, 130); this.part(x, y, Math.cos(a) * s, Math.sin(a) * s, rnd(0.25, 0.6), col, rnd() < 0.5 ? 2 : 1, 60); } },
  spray(x, y) { this.pickups.push({ id: -1, kind: 'crystal', x, y, ph: rnd(6), loose: true, vx: rnd(-60, 60), vy: rnd(-200, -80) }); },
  popup(str, x, y, col) { this.pops.push({ str: String(str), x, y, t: 0, col: col || '#fff' }); },
  shake(amp, time) { this.shakeA = Math.max(this.shakeA, amp); this.shakeT = Math.max(this.shakeT, time); },
  addScore(n, x, y) { this.score += n; if (x !== undefined) this.popup(n, x, y, '#ffe36e'); },

  /* ----- hero ----- */
  hurt(fromX) {
    const h = this.hero, T = TUNE.hero, D = TUNE.difficulty;
    if (h.invuln > 0 || h.dead || this.state !== 'play') return;
    h.pips--; Snd.sfx('hurt'); this.shake(3, 0.25); this.burst(h.x, h.y - 14, 8, '#ff6a6a');
    if (h.pips <= 0) { this.kill(); return; }
    h.invuln = D.invuln; h.stun = T.hurtStun; h.spinT = 0;
    h.vx = (h.x >= fromX ? 1 : -1) * T.hurtKnock; h.vy = -T.hurtHop; h.onGround = false; h.carry = 0;
  },
  kill(pit) {
    const h = this.hero;
    if (h.dead) return;
    h.dead = true; h.pips = 0; this.lives--; this.state = 'dying'; this.stateT = 0;
    h.vx = 0; h.vy = pit ? 0 : -250; Snd.sfx('die'); Snd.duck(true);
  },
  defeat(e, how) {
    const h = this.hero;
    e.alive = false;
    h.combo = how === 'stomp' ? h.combo + 1 : 0;
    this.addScore(e.def.score * Math.max(1, h.combo), e.x, e.y - e.h - 6);
    this.corpses.push({ s: e.def.corpse(e), x: e.x, y: e.y, vx: (e.x >= h.x ? 1 : -1) * 50, vy: -170, t: 0 });
    this.burst(e.x, e.y - e.h / 2, 10, '#fff'); Snd.sfx('pop');
  },
  windAt(x) { let w = 0; for (const z of this.L.zones) if (z.type === 'gust' && z.k > 0 && x > z.x0 && x < z.x1) w += z.dir * z.k * TUNE.difficulty.gustPush; return w; },

  updateHero(dt, ctl) {
    const h = this.hero, T = TUNE.hero, F = TUNE.feel, D = TUNE.difficulty, ph = this.world.physics, L = this.L;
    h.anim += dt;
    h.invuln = Math.max(0, h.invuln - dt); h.stun = Math.max(0, h.stun - dt);
    h.spinCd = Math.max(0, h.spinCd - dt); h.spinT = Math.max(0, h.spinT - dt);
    h.jumpBuf = Math.max(0, h.jumpBuf - dt); h.spinBuf = Math.max(0, h.spinBuf - dt); h.coyote = Math.max(0, h.coyote - dt);
    if (h.dead) { h.vy = Math.min(h.vy + T.gravity * dt, 420); h.y += h.vy * dt; return; }
    const can = h.stun <= 0 && this.state === 'play';

    // ---- run + face. `carry` keeps a gesture run going through a jump (see TUNE.feel) ----
    let run = 0;
    if (can) {
      if (ctl.face && ctl.face !== h.facing) { h.facing = ctl.face; Snd.sfx('turn'); }
      run = ctl.run;
      if (run > 0) h.carry = ctl.sticky ? run : 0;
      else if (F.airCarry && h.carry > 0) { if (!h.onGround || h.landT < F.landCarry) run = h.carry; else h.carry = 0; }
    }
    const wind = this.windAt(h.x); this.windNow = wind;
    const target = h.facing * run * T.runSpeed * (h.inQuick ? 0.45 : 1) + wind * (h.onGround && run === 0 ? 0.6 : 1);
    const acc = h.stun > 0 ? T.airDecel : run > 0 || wind ? (h.onGround ? T.accel * ph.accel : T.airAccel) : (h.onGround ? T.decel * ph.friction : T.airDecel);
    h.vx = approach(h.vx, target, acc * dt);

    // ---- jump (buffered, with coyote time) and double jump ----
    if (ctl.jump) h.jumpBuf = F.jumpBuffer;
    if (h.jumpBuf > 0 && can) {
      if (h.onGround || h.coyote > 0 || h.inQuick) {
        h.vy = -T.jumpVel * ph.jump * (h.inQuick ? 0.82 : 1); h.onGround = false; h.coyote = 0; h.jumpBuf = 0; h.airJumps = 0;
        Snd.sfx('jump'); this.dust(h.x, h.y, 5, this.world.ground[1]);
      } else if (h.airJumps < 1) {
        h.vy = -T.doubleJumpVel * ph.jump; h.airJumps = 1; h.jumpBuf = 0;
        Snd.sfx('djump'); for (let i = -3; i <= 3; i++) this.part(h.x + i * 3, h.y, i * 14, 30, 0.35, '#9af4f6', 2);
      }
    }
    // ---- spin attack ----
    if (ctl.spin) h.spinBuf = F.spinBuffer;
    if (h.spinBuf > 0 && h.spinCd <= 0 && can) { h.spinT = T.spinTime; h.spinCd = T.spinCooldown; h.spinBuf = 0; h.spinHit = new Set(); Snd.sfx('spin'); }

    // ---- gravity (quicksand swallows slowly instead) ----
    if (h.inQuick && h.vy >= 0) h.vy = approach(h.vy, D.quicksandSink, 2000 * dt);
    else h.vy = Math.min(h.vy + T.gravity * ph.gravity * (h.spinT > 0 && h.vy > 0 ? T.spinAirGravity : 1) * dt, T.maxFall * ph.maxFall);

    const was = h.onGround, vy0 = h.vy;
    moveBody(L, h, dt);
    if (h.onGround) {
      if (!was) { h.landT = 0; h.combo = 0; if (vy0 > 150) { Snd.sfx('land'); this.dust(h.x, h.y, 4, this.world.ground[1]); } }
      h.landT += dt; h.coyote = F.coyote; h.airJumps = 0;
      h.runPhase += Math.abs(h.vx) * dt * 0.1;
    }
    // ---- quicksand ----
    const qt = L.quickTop(h.x, h.y - 0.5);
    h.inQuick = qt !== null && h.y > qt;
    if (h.inQuick) {
      if (Math.random() < dt * 14) this.dust(h.x + rnd(-6, 6), qt + 1, 1, this.world.quicksand[0]);
      if (h.y - qt > D.quicksandDepth) {                 // swallowed: lose a pip and get spat back out
        const pips = h.pips; h.invuln = 0; this.hurt(h.x - h.facing);
        if (pips > 1) { h.vx = 0; h.vy = -T.jumpVel * 1.05; h.y = qt + 6; h.stun = 0.15; this.dust(h.x, qt, 14, this.world.quicksand[0]); Snd.sfx('quick'); }
      }
    }
    // ---- boss arena walls, pits ----
    if (this.bossOn && L.arena) { const nx = clamp(h.x, L.arena.x0 + 8, L.arena.x1 - 8); if (nx !== h.x) { h.x = nx; h.vx = 0; } }
    if (h.y > L.pxH + 44) this.kill(true);
  },

  update(dt, ctl) {
    const h = this.hero, L = this.L, D = TUNE.difficulty, T = TUNE.hero;
    this.stateT += dt;
    if (this.state === 'play') this.time += dt;
    if (this.banner && (this.banner.t -= dt) <= 0) this.banner = null;
    this.shakeT = Math.max(0, this.shakeT - dt); if (this.shakeT <= 0) this.shakeA = 0;

    // sandstorm gust zones: calm -> warn (telegraph) -> blow
    for (const z of L.zones) if (z.type === 'gust') {
      const near = h.x > z.x0 - 260 && h.x < z.x1 + 200, cyc = (this.time + 2.2) % z.period, calm = z.period - z.lead - z.blow;
      const st = !near ? 'calm' : cyc < calm ? 'calm' : cyc < calm + z.lead ? 'warn' : 'blow';
      if (st !== z.state) { z.state = st; if (st === 'warn') Snd.sfx('gustWarn'); if (st === 'blow') Snd.sfx('gust'); }
      z.k = approach(z.k, st === 'blow' ? 1 : 0, dt * 2.5);
    }

    this.updateHero(dt, ctl);

    // enemies
    for (const e of this.enemies) {
      if (!e.alive || Math.abs(e.x - h.x) > 420) continue;
      e.def.update(e, dt, this);
      if (!e.alive || e.hidden || h.dead) continue;
      const ex0 = e.x - e.w / 2, ex1 = e.x + e.w / 2, ey0 = e.y - e.h;
      if (h.spinT > 0 && !h.spinHit.has(e) && Math.abs(e.x - h.x) < T.spinReach + e.w / 2 && e.y > h.y - h.h - 8 && ey0 < h.y + 4) {
        if (e.spinnable) { this.defeat(e, 'spin'); continue; }
        h.spinHit.add(e);
      }
      if (h.x + h.w / 2 > ex0 && h.x - h.w / 2 < ex1 && h.y > ey0 && h.y - h.h < e.y) {
        const onTop = h.vy > 30 && !h.onGround && h.y - ey0 <= D.stompGrace + h.vy * dt;
        if (onTop && e.stompable) {
          this.defeat(e, 'stomp'); h.vy = -(ctl.held ? T.stompBounceHeld : T.stompBounce); h.airJumps = 0; Snd.sfx('stomp');
        } else if (e.hazard) {
          const s = D.hurtShrink;
          if (h.x + h.w / 2 > ex0 + s && h.x - h.w / 2 < ex1 - s && h.y > ey0 + s) {
            if (onTop && h.invuln <= 0) { this.hurt(e.x); h.vy = -T.hurtHop * 1.2; this.popup('SPIKY! SPIN IT', e.x, ey0 - 14, '#ff9a9a'); }
            else this.hurt(e.x);
          }
        }
      }
    }
    // pickups
    for (const p of this.pickups) {
      if (p.loose) { p.vy += 500 * dt; p.x += p.vx * dt; p.y += p.vy * dt; if (p.y > L.arena.y - 10) { p.y = L.arena.y - 10; p.vy *= -0.5; p.vx *= 0.7; } }
      if (h.dead || Math.abs(p.x - h.x) > 15 || p.y < h.y - h.h - 9 || p.y > h.y + 7) continue;
      p.gone = true; if (p.id >= 0) this.taken.add(p.id);
      if (p.kind === 'crystal') { this.crystals++; this.addScore(TUNE.score.crystal); Snd.sfx('crystal'); this.burst(p.x, p.y, 5, '#b4fbff'); }
      else { this.fruit = true; this.lives++; this.addScore(TUNE.score.fruit, p.x, p.y - 12); this.popup('1UP!', p.x, p.y - 26, '#8dffc0'); Snd.sfx('fruit'); this.burst(p.x, p.y, 20, '#ff9ad8'); }
    }
    this.pickups = this.pickups.filter(p => !p.gone);
    // checkpoints
    for (const c of this.checks) if (!c.on && !h.dead && Math.abs(c.x - h.x) < 16 && Math.abs(c.y - h.y) < 48) {
      c.on = true; this.checkAt = Math.max(this.checkAt, c.i); this.respawnAt = { x: c.x, y: c.y };
      if (D.checkpointHeals) h.pips = D.pips;
      Snd.sfx('check'); this.popup('CHECKPOINT', c.x, c.y - 56, '#8dffc0'); this.burst(c.x, c.y - 36, 16, '#8dffc0');
    }
    // zones: hints and the secret shade
    let hint = null, inShade = false;
    for (const z of L.zones) {
      if (h.x < z.x0 || h.x > z.x1) continue;
      if (z.type === 'hint') hint = z.id;
      if (z.type === 'shade' && h.y > z.r0 * TS && h.y <= z.r1 * TS + 2) inShade = true;
    }
    if (this.bossOn && this.boss && this.boss.hp < this.boss.maxHp) hint = null;
    this.hint = this.state === 'play' ? hint : null;
    this.shadeK = approach(this.shadeK, inShade ? 0.15 : 1, dt * 3);

    // boss
    if (L.arena && !this.bossOn && !this.bossDone && !h.dead && h.x > L.arena.x0 + 56 && this.course.boss && BOSSES[this.course.boss.type]) {
      this.bossOn = true; this.boss = BOSSES[this.course.boss.type].create(this, this.course.boss.tier, L.arena);
      Snd.music(this.world.bossMusic);
    }
    if (this.boss && !this.boss.dead) {
      this.boss.update(dt);
      if (this.boss.dead && this.state === 'play') {
        this.bossOn = false; this.bossDone = true; this.state = 'won'; this.stateT = 0;
        this.addScore(TUNE.score.boss, this.boss.x, this.boss.gy - 60); Snd.sfx('clear'); h.invuln = 99;
      }
    }

    // effects
    for (const p of this.parts) { p.life -= dt; p.vy += p.grav * dt; p.x += p.vx * dt; p.y += p.vy * dt; }
    this.parts = this.parts.filter(p => p.life > 0);
    for (const p of this.pops) p.t += dt; this.pops = this.pops.filter(p => p.t < 1.1);
    for (const c of this.corpses) { c.t += dt; c.vy += 600 * dt; c.x += c.vx * dt; c.y += c.vy * dt; } this.corpses = this.corpses.filter(c => c.t < 2);
    for (const pr of this.props) if (pr.kind === 'wreck' && Math.random() < dt * 5) this.part(pr.x - 8 + rnd(-3, 3), pr.y - 26, rnd(-4, 8), rnd(-26, -14), rnd(0.8, 1.6), rnd() < 0.5 ? '#6a5a7c' : '#9a8aa8', 2);

    // camera: look ahead of the hero; lock onto the arena during the boss
    let tx = h.x - VIEW_W * 0.42 + h.facing * 30;
    if ((this.bossOn || this.state === 'won') && L.arena) tx = L.arena.x0 + (L.arena.x1 - L.arena.x0 - VIEW_W) / 2;

    // life lost -> back to the checkpoint, or out of lives
    if (this.state === 'dying' && this.stateT > 1.6) return this.lives > 0 ? (this.populate(), 'respawn') : 'gameover';
    if (this.state === 'won' && this.stateT > 4.2) return 'clear';
    return null;
  },

  /* ----- drawing ----- */
  draw(ctx) {
    const L = this.L, h = this.hero;
    const sx = this.shakeT > 0 ? Math.round(rnd(-1, 1) * this.shakeA) : 0, sy = this.shakeT > 0 ? Math.round(rnd(-1, 1) * this.shakeA) : 0;
    const cx = Math.round(this.cam.x) + sx, cy = Math.round(this.cam.y) + sy;
    for (const l of this.bg) {
      const o = ((Math.floor(cx * l.f) % BG_W) + BG_W) % BG_W;
      ctx.drawImage(l.c, -o, 0); if (o > BG_W - VIEW_W) ctx.drawImage(l.c, BG_W - o, 0);
    }
    const pitY = L.pitY - cy;                              // below the ground line it is dark, so pits read as pits
    ctx.fillStyle = '#3a1848'; ctx.fillRect(0, pitY, VIEW_W, 5);
    ctx.fillStyle = '#26103a'; ctx.fillRect(0, pitY + 5, VIEW_W, 9);
    ctx.fillStyle = '#160a26'; ctx.fillRect(0, pitY + 14, VIEW_W, VIEW_H);
    ctx.save(); ctx.translate(-cx, -cy);
    const vis = (x, m = 48) => x > cx - m && x < cx + VIEW_W + m;
    for (const p of this.props) if (vis(p.x, 70)) { const s = SPR.props[p.kind]; drawSpr(ctx, Array.isArray(s) ? s[p.v] : s, p.x, p.y, p.kind === 'tree' && p.v === 1); }
    for (const ch of L.chunks) if (ch.x < cx + VIEW_W && ch.x + ch.c.width > cx) ctx.drawImage(ch.c, ch.x, 0);
    for (const c of this.checks) if (vis(c.x)) drawSpr(ctx, SPR.beacon[c.on ? 1 + (Math.floor(this.time * 4) % 2) : 0], c.x, c.y + 1);
    for (const p of this.pickups) if (vis(p.x)) {
      if (p.kind === 'crystal') drawSpr(ctx, SPR.crystal[Math.floor(this.time * 7 + p.ph) % 4], p.x, p.y + Math.sin(this.time * 3 + p.ph) * 1.5);
      else { drawSpr(ctx, SPR.fruit, p.x, p.y + Math.sin(this.time * 2.5) * 2); if (Math.floor(this.time * 6) % 3 === 0) { ctx.fillStyle = '#fff'; ctx.fillRect(Math.round(p.x) + 6, Math.round(p.y) - 9, 1, 3); ctx.fillRect(Math.round(p.x) + 5, Math.round(p.y) - 8, 3, 1); } }
    }
    for (const e of this.enemies) if (e.alive && vis(e.x)) e.def.draw(e, ctx);
    if (this.boss && !this.boss.dead) this.boss.draw(ctx);
    for (const c of this.corpses) { ctx.save(); ctx.translate(Math.round(c.x), Math.round(c.y - c.s.h / 2)); ctx.scale(1, -1); drawSpr(ctx, c.s, 0, c.s.h / 2); ctx.restore(); }
    this.drawHero(ctx);
    this.drawQuicksand(ctx, cx);
    for (const p of this.parts) { ctx.fillStyle = p.col; ctx.fillRect(Math.round(p.x), Math.round(p.y), p.size, p.size); }
    for (const z of L.zones) if (z.type === 'shade' && this.shadeK > 0.02 && z.x1 > cx && z.x0 < cx + VIEW_W) {
      ctx.globalAlpha = this.shadeK * 0.86; ctx.fillStyle = '#160c2c'; ctx.fillRect(z.x0, z.r0 * TS, z.x1 - z.x0, (z.r1 - z.r0) * TS); ctx.globalAlpha = 1;
    }
    for (const p of this.pops) if (p.t < 0.8 || Math.floor(p.t * 20) % 2) text(ctx, p.str, p.x, p.y - p.t * 22, { a: 'c', c: p.col });
    ctx.restore();
    this.drawWeather(ctx, cx);
    this.drawHUD(ctx);
  },
  drawHero(ctx) {
    const h = this.hero, H = SPR.hero, T = TUNE.hero;
    if (h.dead) { ctx.save(); ctx.translate(Math.round(h.x), Math.round(h.y - 15)); ctx.scale(1, -1); drawSpr(ctx, H.hurt, 0, 15, h.facing < 0); ctx.restore(); return; }
    if (h.invuln > 0 && this.state === 'play' && Math.floor(h.invuln * 15) % 2 === 0) return;
    let f;
    if (this.state === 'won' && h.onGround) f = H.win[Math.floor(this.stateT * 4) % 2];
    else if (h.spinT > 0) f = H.spin[Math.floor((T.spinTime - h.spinT) * 24) % 4];
    else if (h.stun > 0) f = H.hurt;
    else if (!h.onGround && !h.inQuick) f = h.vy < 0 ? H.jump : H.fall;
    else if (Math.abs(h.vx) > 14) f = H.run[Math.floor(h.runPhase) % 6];
    else f = H.idle[Math.floor(h.anim * 2) % 2];
    drawSpr(ctx, f, h.x, h.y, h.facing < 0);
    if (h.spinT > 0) {                                     // spin swoosh
      const a0 = (T.spinTime - h.spinT) * 28;
      for (let i = 0; i < 10; i++) for (const o of [0, Math.PI]) {
        const a = a0 + i * 0.2 + o; ctx.fillStyle = i > 6 ? '#fff' : i > 3 ? '#9af4f6' : '#3fd0ee';
        ctx.fillRect(Math.round(h.x + Math.cos(a) * (T.spinReach - 1)) - 1, Math.round(h.y - 13 + Math.sin(a) * 6) - 1, i > 6 ? 3 : 2, i > 6 ? 3 : 2);
      }
    }
  },
  drawQuicksand(ctx, cx) {
    const L = this.L, q = this.world.quicksand, t = this.time;
    if (!q) return;
    for (let c = Math.max(0, cx >> 4); c <= Math.min(L.w - 1, (cx + VIEW_W) >> 4); c++) for (let r = 0; r < L.h; r++) {
      if (L.k[r * L.w + c] !== T_QUICK) continue;
      const top = L.kind(c, r - 1) !== T_QUICK, x = c * TS, y = r * TS + (top ? 3 : 0), hgt = TS - (top ? 3 : 0);
      ctx.fillStyle = q[1]; ctx.fillRect(x, y, TS, hgt);
      ctx.fillStyle = q[2];
      for (let yy = y; yy < y + hgt; yy++) { const ph = (yy - Math.floor(t * 9)) & 7; if (ph < 2) { const o = ((yy >> 3) * 5 + c * 3) & 7; ctx.fillRect(x + o, yy, 5, 1); ctx.fillRect(x + ((o + 9) & 15), yy, 3, 1); } }
      if (top) { ctx.fillStyle = q[0]; for (let i = 0; i < TS; i += 2) ctx.fillRect(x + i, y + Math.round(Math.sin((x + i) * 0.4 + t * 3) * 0.8), 2, 2); }
    }
  },
  drawWeather(ctx, cx) {
    for (const z of this.L.zones) {
      if (z.type !== 'gust' || z.x1 < cx || z.x0 > cx + VIEW_W) continue;
      const k = z.state === 'warn' ? 0.25 : z.k; if (k <= 0.01) continue;
      const x0 = Math.max(0, z.x0 - cx), x1 = Math.min(VIEW_W, z.x1 - cx), t = this.time;
      ctx.globalAlpha = 0.16 * k; ctx.fillStyle = this.world.tint; ctx.fillRect(x0, 0, x1 - x0, VIEW_H); ctx.globalAlpha = 1;
      const n = Math.round(46 * k);
      for (let i = 0; i < n; i++) {
        const sp = 260 + hash2(i, 3) * 240, len = 8 + Math.floor(hash2(i, 7) * 14);
        let x = (hash2(i, 1) * 640 + z.dir * t * sp) % 640; if (x < 0) x += 640; x -= 80;

      }
      if (z.state === 'warn' || z.state === 'blow') {
        const on = z.state === 'blow' || Math.floor(t * 6) % 2;
        if (on) { drawSpr(ctx, SPR.icons.wind, VIEW_W / 2 - 62, 92); text(ctx, z.state === 'warn' ? 'GUST COMING!' : 'HOLD ON!', VIEW_W / 2 - 46, 86, { s: 2, c: z.state === 'warn' ? '#ffe36e' : '#fff' }); }

  },
  drawHUD(ctx) {
    const h = this.hero, D = TUNE.difficulty, camOn = Gest.live;
    ctx.globalAlpha = 0.5; ctx.fillStyle = '#140c28'; ctx.fillRect(0, 0, VIEW_W, 25); ctx.globalAlpha = 1;
    // lives
    drawSpr(ctx, SPR.life, 4, 6);
    text(ctx, 'x' + Math.max(0, this.lives), 22, 6, { s: 2 });
    // health pips

      ctx.fillStyle = full ? '#3fd060' : '#3a2c5c'; ctx.fillRect(x + 1, 5, 10, 15);
      if (full) { ctx.fillStyle = '#b6ffc0'; ctx.fillRect(x + 2, 6, 8, 4); ctx.fillStyle = '#2a9a48'; ctx.fillRect(x + 1, 17, 10, 3); }
      else { ctx.fillStyle = '#55437c'; ctx.fillRect(x + 2, 6, 8, 1); }

    text(ctx, String(this.crystals).padStart(3, '0'), 138, 6, { s: 2, c: '#b4fbff' });
    if (this.fruit) drawSpr(ctx, SPR.fruit, 190, 12);
    text(ctx, String(this.score).padStart(6, '0'), camOn ? 384 : 474, 6, { s: 2, a: 'r', c: '#ffe36e' });

      const b = this.boss, w = 228, x = (VIEW_W - w) / 2, y = 252;
      text(ctx, b.name, VIEW_W / 2, y - 18, { s: 2, a: 'c', c: '#ffd0c0' });
      ctx.fillStyle = INK; ctx.fillRect(x - 2, y - 1, w + 4, 14);

      const x = Math.round(((camOn ? 372 : VIEW_W) - w) / 2), y = 30;
      ctx.globalAlpha = 0.72; ctx.fillStyle = '#140c28'; ctx.fillRect(x, y, w, hh); ctx.globalAlpha = 1;
      ctx.fillStyle = '#ffe36e'; ctx.fillRect(x, y, w, 1); ctx.fillRect(x, y + hh - 1, w, 1);
      drawSpr(ctx, SPR.icons[hint.icon], x + 15, y + hh / 2);
      lines.forEach((l, i) => text(ctx, l, x + 30, y + 5 + i * 17, { s: 2, c: i ? '#b4fbff' : '#fff' }));

      text(ctx, b.a, VIEW_W / 2, 92, { s: 2, a: 'c', c: '#b4fbff' }); text(ctx, b.b, VIEW_W / 2, 114, { s: 3, a: 'c', c: '#ffe36e' });
      ctx.globalAlpha = 1;
    }
    if (this.state === 'won' && this.stateT > 0.6) text(ctx, 'COURSE CLEAR!', VIEW_W / 2, 96, { s: 4, a: 'c', c: Math.floor(this.stateT * 8) % 2 ? '#ffe36e' : '#fff' });

/* #####################################################################
   7. HAND TRACKING - camera, MediaPipe Gesture Recognizer, gesture logic
   Everything runs on the device; no video ever leaves the phone.

   Coordinates: MediaPipe reports landmarks in the raw camera image. We
   flip x straight away (x = 1 - x) so the rest of the code works in
   "mirror" space: your right hand is on the right, a swipe to your
   right moves right.
   ##################################################################### */
const MP_VERSION = '1.2.3';
const MP_BASE = 'https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@' + MP_VERSION;
const MP_MODEL = 'https://storage.googleapis.com/mediapipe-models/gesture_recognizer/gesture_recognizer/float16/1/gesture_recognizer.task';
const HAND_LINKS = [[0, 1], [1, 2], [2, 3], [3, 4], [0, 5], [5, 6], [6, 7], [7, 8], [5, 9], [9, 10], [10, 11], [11, 12], [9, 13], [13, 14], [14, 15], [15, 16], [13, 17], [17, 18], [18, 19], [19, 20], [0, 17]];

// Messages for everything that can go wrong starting the camera / tracker.
const CAM_ERRORS = {
  denied:   { title: 'CAMERA BLOCKED', lines: ['THE GAME NEEDS THE CAMERA TO SEE YOUR HANDS.', 'NOTHING IS RECORDED OR SENT ANYWHERE.', '', 'ALLOW THE CAMERA FOR THIS SITE IN YOUR', 'BROWSER SETTINGS, THEN TAP TRY AGAIN.'] },
  insecure: { title: 'NEEDS A SECURE ADDRESS', lines: ['BROWSERS ONLY SHARE THE CAMERA WITH PAGES', 'OPENED OVER HTTPS. OPEN THE HTTPS ADDRESS', 'OF THIS GAME (GITHUB PAGES USES HTTPS).'] },
  nocamera: { title: 'NO CAMERA FOUND', lines: ['THIS DEVICE DID NOT OFFER A CAMERA.', 'YOU CAN STILL PLAY WITH A KEYBOARD.'] },
  busy:     { title: 'CAMERA IS BUSY', lines: ['ANOTHER APP OR TAB IS USING THE CAMERA.', 'CLOSE IT, THEN TAP TRY AGAIN.'] },
  network:  { title: 'TRACKER DID NOT LOAD', lines: ['THE HAND TRACKING FILES COULD NOT BE', 'DOWNLOADED. CHECK YOUR CONNECTION,', 'THEN TAP TRY AGAIN.'] },
  unknown:  { title: 'CAMERA PROBLEM', lines: ['SOMETHING WENT WRONG STARTING THE', 'CAMERA OR THE HAND TRACKER.'] },
};

const Gest = {
  state: 'off',            // off | starting | loading | ready | error
  error: null, delegate: '', video: null, stream: null, recognizer: null,
  aspect: 4 / 3, pv: null, pvg: null,
  hands: [], action: null, dirHand: null, memA: null, memD: null, crossT: 0,
  frames: 0, hz: 0, cost: 0, lastRunT: 0, lastVideoT: -1, since: 0, pending: false, fails: 0,
  seenAny: 0, seenAction: 0,                 // seconds (performance clock) a hand was last seen
  // --- gesture output ---
  stable: 'none',                            // none | two | palm | fist  (action hand, after the hold-frames filter)
  walking: false, walkSpeed: 0, walkT: -9,   // walkT = last moment finger-walking was active
  ev: { jump: false, spin: false, face: 0 }, // one-shot events, cleared when read
  lit: { run: -9, jump: -9, djump: -9, spin: -9, left: -9, right: -9 },   // for the test screen + HUD icon
  air: false,                                // set by the game: hero is airborne and can still double jump
  A: null, D: null,                          // detector state

  get live() { return this.state === 'ready'; },
  resetDetectors() {
    this.A = { raw: 'none', rawN: 0, armed: true, palmT: -9, palmOpen: 2, fistT: 0, fistWait: 0, lastJump: -9, mean: null, anchor: null, anchorMag: 0, swaps: [], poseT: -9, lastT: 0, speed: 0 };
    this.D = { samples: [], scale: 0.1, coolT: 0, oppT: 0, lastDir: 0 };
    this.stable = 'none'; this.walking = false; this.ev.jump = this.ev.spin = false; this.ev.face = 0;
  },

  /* ----- start-up ----- */
  async start() {
    if (this.state === 'starting' || this.state === 'loading' || this.state === 'ready') return;
    this.state = 'starting'; this.error = null;
    let phase = 'camera';
    try {
      if (!window.isSecureContext) throw { code: 'insecure' };
      if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) throw { code: 'nocamera' };
      const T = TUNE.tracking;
      if (!this.stream) this.stream = await navigator.mediaDevices.getUserMedia({ audio: false, video: { facingMode: 'user', width: { ideal: T.camWidth }, height: { ideal: T.camHeight }, frameRate: { ideal: 30 } } });
      const v = this.video = document.getElementById('cam');
      v.srcObject = this.stream;
      await v.play();
      if (!v.videoWidth) await new Promise((res) => { v.addEventListener('loadeddata', res, { once: true }); setTimeout(res, 3000); });
      this.aspect = (v.videoWidth || 4) / (v.videoHeight || 3);
      this.pv = mkCanvas(160, Math.round(160 / this.aspect)); this.pvg = this.pv.getContext('2d');
      this.state = 'loading'; phase = 'tracker';
      if (!this.recognizer) {
        const mp = await import(MP_BASE + '/vision_bundle.mjs');
        const files = await mp.FilesetResolver.forVisionTasks(MP_BASE + '/wasm');
        this.mk = (delegate) => mp.GestureRecognizer.createFromOptions(files, {
          baseOptions: { modelAssetPath: MP_MODEL, delegate },
          runningMode: 'VIDEO', numHands: 2,
          minHandDetectionConfidence: 0.5, minHandPresenceConfidence: 0.5, minTrackingConfidence: 0.5,
        });
        try { this.recognizer = await this.mk('GPU'); this.delegate = 'GPU'; }
        catch (e) { this.recognizer = await this.mk('CPU'); this.delegate = 'CPU'; }
      }
      this.resetDetectors(); this.fails = 0; this.seenAny = now() / 1000;
      this.state = 'ready';
    } catch (e) {
      let code = e && e.code;
      if (!code) {
        const n = (e && e.name) || '';
        code = phase === 'tracker' ? 'network'
          : n === 'NotAllowedError' || n === 'SecurityError' || n === 'PermissionDeniedError' ? 'denied'
          : n === 'NotFoundError' || n === 'OverconstrainedError' || n === 'DevicesNotFoundError' ? 'nocamera'
          : n === 'NotReadableError' || n === 'AbortError' || n === 'TrackStartError' ? 'busy' : 'unknown';
      }
      this.error = Object.assign({ code, detail: String((e && e.message) || '') }, CAM_ERRORS[code]);
      this.state = 'error';
      if (phase === 'camera') this.stop();
      console.warn('SUPERSPACE camera/tracker:', code, e);
    }
  },
  stop() {
    if (this.stream) { for (const t of this.stream.getTracks()) t.stop(); this.stream = null; }
    if (this.video) this.video.srcObject = null;
    if (this.state === 'ready') this.state = 'off';
    this.hands = []; this.action = this.dirHand = null;
  },

  /* ----- scheduling: called after every rendered game frame -----
     Tracking never runs inside the game step. After each pass the game gets
     `ceil(cost * budget)` frames to itself, which holds it above 30 fps. */
  afterFrame() {
    if (this.state !== 'ready' || this.pending) return;
    this.since++;
    const T = TUNE.tracking, t = now();
    if (this.since < Math.max(1, Math.ceil(this.cost * T.budget)) || t - this.lastRunT < 1000 / T.maxHz) return;
    this.pending = true;
    setTimeout(() => { this.pending = false; this.since = 0; this.track(); }, 0);
  },
  track() {
    const v = this.video;
    if (this.state !== 'ready' || !v || v.readyState < 2 || v.paused) return;
    if (v.currentTime === this.lastVideoT) return;            // no new camera frame yet
    this.lastVideoT = v.currentTime;
    const t0 = now(); let res = null;
    try { res = this.recognizer.recognizeForVideo(v, t0); this.fails = 0; }
    catch (e) {
      if (++this.fails >= 3 && this.delegate === 'GPU' && this.mk) {         // GPU path is broken on this device: fall back
        this.delegate = 'CPU'; this.fails = 0;
        this.mk('CPU').then(r => { this.recognizer = r; }).catch(() => {});
      }
      return;
    }
    const t1 = now();
    this.cost = this.cost ? lerp(this.cost, t1 - t0, 0.2) : t1 - t0;
    if (this.lastRunT) this.hz = lerp(this.hz || 15, 1000 / Math.max(1, t0 - this.lastRunT), 0.15);
    this.lastRunT = t0;
    this.pvg.save(); this.pvg.translate(this.pv.width, 0); this.pvg.scale(-1, 1);            // mirrored preview frame
    this.pvg.drawImage(v, 0, 0, this.pv.width, this.pv.height); this.pvg.restore();
    this.feed(res, t0);
  },

  /* ----- one tracking result in -> gesture state out. Also used by tests. ----- */
  feed(res, tMs) {
    const t = tMs / 1000, n = res && res.landmarks ? res.landmarks.length : 0, hands = [];
    if (!this.A) this.resetDetectors();
    for (let i = 0; i < n; i++) hands.push(this.makeHand(res, i));
    this.assign(hands, t);
    this.hands = hands; this.frames++;
    if (n) this.seenAny = t;
    if (this.action) this.seenAction = t;
    this.updateAction(this.action, t);
    this.updateSwipe(this.dirHand, t);
  },
  makeHand(res, i) {
    const src = res.landmarks[i], ar = this.aspect, lm = new Array(21);
    for (let k = 0; k < 21; k++) lm[k] = { x: 1 - src[k].x, y: src[k].y, z: src[k].z || 0 };
    const P = (k) => [lm[k].x * ar, lm[k].y, lm[k].z * ar];
    const d3 = (a, b) => Math.hypot(a[0] - b[0], a[1] - b[1], a[2] - b[2]);
    const w = P(0), scale = Math.max(d3(w, P(9)), d3(P(5), P(17)) * 1.3, 1e-4);        // hand-length unit
    // how far each finger reaches from the wrist: about 1.9 = straight, about 1 = curled
    const ratio = (tip, mcp) => d3(P(tip), w) / Math.max(1e-4, d3(P(mcp), w));
    const r = [ratio(8, 5), ratio(12, 9), ratio(16, 13), ratio(20, 17)];
    let cx = 0, cy = 0; for (const p of lm) { cx += p.x; cy += p.y; }
    const hd = (res.handedness || res.handednesses || [])[i], g = res.gestures && res.gestures[i] && res.gestures[i][0];
    const a = P(8), b = P(12), zw = TUNE.gesture.walkDepthWeight;
    return {
      lm, cx: cx / 21, cy: cy / 21, scale, r, open: (r[0] + r[1] + r[2] + r[3]) / 4,
      label: hd && hd[0] ? hd[0].categoryName : '', labelScore: hd && hd[0] ? hd[0].score : 0,
      g: g ? g.categoryName : 'None', gs: g ? g.score : 0,
      // "two fingers out": ring and little finger curled, index or middle reaching out
      twoPose: r[2] < 1.42 && r[3] < 1.42 && Math.max(r[0], r[1]) > 1.45,
      // index fingertip relative to middle fingertip, in hand-lengths: the finger-walk signal
      walkVec: [(a[0] - b[0]) / scale, (a[1] - b[1]) / scale, (a[2] - b[2]) / scale * zw],
      role: '',

  },
  // Decide which hand is the action hand and which the direction hand.
  assign(hands, t) {
    const side = settings().actionSide, fresh = (m) => m && t - m.t < 1.0, dist = (h, m) => Math.hypot(h.cx - m.x, h.cy - m.y);
    let A = null, D = null;
    if (hands.length >= 2) {
      const l = hands[0].cx <= hands[1].cx ? hands[0] : hands[1], r = l === hands[0] ? hands[1] : hands[0];
      A = side === 'left' ? l : r; D = side === 'left' ? r : l;
      // a fast swipe can carry the direction hand past the action hand: follow each hand by
      // where it was a moment ago, unless the "crossed" layout persists
      if (fresh(this.memA) && fresh(this.memD) && dist(D, this.memA) + dist(A, this.memD) < (dist(A, this.memA) + dist(D, this.memD)) * 0.6) {
        this.crossT = this.crossT || t;
        if (t - this.crossT < 1.5) { const s = A; A = D; D = s; }
      } else this.crossT = 0;
    } else if (hands.length === 1) {
      const h = hands[0], fa = fresh(this.memA), fd = fresh(this.memD), lbl = settings().actionLabel;
      let act;
      if (fa && fd) act = dist(h, this.memA) <= dist(h, this.memD);
      else if (fa) act = dist(h, this.memA) < 0.3;
      else if (fd) act = dist(h, this.memD) >= 0.3;
      else if (lbl && h.label && h.labelScore > 0.85) act = h.label === lbl;
      else act = (h.cx > 0.5) === (side === 'right');
      if (act) A = h; else D = h;
    }
    if (A) { A.role = 'action'; this.memA = { x: A.cx, y: A.cy, t }; }
    if (D) { D.role = 'dir'; this.memD = { x: D.cx, y: D.cy, t }; }
    this.action = A; this.dirHand = D;
  },

  /* ----- ACTION HAND: finger-walk (run), open palm (jump), fist (spin) ----- */
  updateAction(h, t) {
    const A = this.A, G = TUNE.gesture, S = settings();
    if (!h) {                                               // hand not visible this frame
      if (t - this.seenAction > G.dropout) { A.raw = 'none'; A.rawN = 0; this.stable = 'none'; this.walking = false; A.anchor = null; A.swaps.length = 0; A.fistWait = 0; }
      return;
    }
    // 1. raw pose for this frame. Open_Palm and Closed_Fist come from MediaPipe's
    //    built-in classifier; "two fingers" is read from the landmarks.
    let raw = 'none';
    if (h.g === 'Open_Palm' && h.gs >= S.minScore) raw = 'palm';
    else if (h.g === 'Closed_Fist' && h.gs >= S.minScore) raw = 'fist';
    else if (h.twoPose || h.g === 'Victory') raw = 'two';
    // 2. a pose must hold for N tracking frames before it counts
    if (raw === A.raw) A.rawN++; else { A.raw = raw; A.rawN = 1; }
    let changed = false;
    if (A.rawN >= S.holdFrames && this.stable !== raw) { this.stable = raw; changed = true; }
    // 3. open palm = jump. A second jump (the double jump) needs the hand to really
    //    close in between, so a flickering classifier cannot fire it by accident.
    if (this.stable === 'palm') {
      if (changed) {
        if (A.armed) {
          A.armed = false; this.ev.jump = true; this.lit.jump = t;
          if (t - A.lastJump < 1.6) this.lit.djump = t;
          A.lastJump = t;
        }
        A.palmOpen = h.open;
      } else A.palmOpen = lerp(A.palmOpen, h.open, 0.4);
      A.palmT = t; A.fistWait = 0;
    } else if (!A.armed && (h.open < A.palmOpen - G.reopenDrop || raw === 'fist' || raw === 'two' || t - A.palmT > G.rearmTime)) A.armed = true;
    // 4. fist = spin. In the air, right after an open palm, wait a moment first:
    //    it may be the "close" of open-close-open (double jump).
    if (this.stable === 'fist') {
      if (changed) {
        if (this.air && t - A.palmT < 0.7) A.fistWait = t + G.fistAirDelay;
        else { this.ev.spin = true; this.lit.spin = t; A.fistT = t; }
      } else if (A.fistWait && t >= A.fistWait) { A.fistWait = 0; this.ev.spin = true; this.lit.spin = t; A.fistT = t; }
      else if (!A.fistWait && G.fistRepeat > 0 && t - A.fistT >= G.fistRepeat) { this.ev.spin = true; this.lit.spin = t; A.fistT = t; }
    } else A.fistWait = 0;
    // 5. finger-walk. Track the index fingertip relative to the middle fingertip.
    //    Each time that offset flips to the other side of its resting value the
    //    fingers have swapped which one is in front: one step. Steps per second = speed.
    if (h.twoPose || h.g === 'Victory' || h.g === 'Pointing_Up') A.poseT = t;
    const poseOk = t - A.poseT < 0.3 && this.stable !== 'palm' && this.stable !== 'fist' && raw !== 'palm' && raw !== 'fist';
    const v3 = h.walkVec, dtf = Math.min(0.2, Math.max(0.001, t - A.lastT)); A.lastT = t;
    if (!A.mean) A.mean = v3.slice();
    const km = 1 - Math.exp(-dtf / G.walkBaselineTau);
    for (let i = 0; i < 3; i++) A.mean[i] += (v3[i] - A.mean[i]) * km;
    if (!poseOk) { A.anchor = null; A.swaps.length = 0; }
    else {
      const d = [v3[0] - A.mean[0], v3[1] - A.mean[1], v3[2] - A.mean[2]], mag = Math.hypot(d[0], d[1], d[2]);
      const thr = lerp(G.walkSwapHard, G.walkSwapEasy, clamp(S.walkSens, 0, 1));
      if (!A.anchor) { if (mag > thr) { A.anchor = d.map(c => c / mag); A.anchorMag = mag; } }
      else {
        const proj = d[0] * A.anchor[0] + d[1] * A.anchor[1] + d[2] * A.anchor[2];
        if (proj < -thr) { A.swaps.push(t); A.anchor = d.map(c => c / mag); A.anchorMag = mag; }      // the fingertips swapped
        else if (proj > A.anchorMag) { A.anchor = d.map(c => c / mag); A.anchorMag = proj; }
      }
    }
    while (A.swaps.length && t - A.swaps[0] > 1.4) A.swaps.shift();
