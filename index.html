    if (n >= G.walkStartSwaps) {
      const m = Math.min(n - 1, 3), step = (A.swaps[n - 1] - A.swaps[n - 1 - m]) / m;
      const timeout = clamp(step * 1.6, G.walkTimeoutMin, G.walkTimeoutMax);
      if (t - A.swaps[n - 1] < timeout && step < G.walkSwapGap) {
        walking = true;
        speed = clamp(lerp(G.walkMinSpeed, 1, (1 / step - G.walkRateSlow) / (G.walkRateFast - G.walkRateSlow)), G.walkMinSpeed, 1);
      }
    }
    if (!walking && S.easyRun && this.stable === 'two') { walking = true; speed = G.easyRunSpeed; }   // "Easy run"
    if (walking) { A.speed = A.speed ? lerp(A.speed, speed, 0.5) : speed; this.walkSpeed = A.speed; this.walkT = t; this.lit.run = t; }
    else A.speed = 0;
    this.walking = walking;
  },

  /* ----- DIRECTION HAND: a fast swipe left or right ----- */
  updateSwipe(h, t) {
    const D = this.D, G = TUNE.gesture, S = settings();
    while (D.samples.length && t - D.samples[0].t > G.swipeWindow) D.samples.shift();
    if (!h) return;
    D.scale = lerp(D.scale, h.scale, 0.3);
    const cur = { t, x: h.cx * this.aspect };
    D.samples.push(cur);
    if (t < D.coolT) return;
    const need = lerp(G.swipeSpeedHard, G.swipeSpeedEasy, clamp(S.swipeSens, 0, 1));
    for (let i = 0; i < D.samples.length - 1; i++) {
      const s = D.samples[i], dx = (cur.x - s.x) / D.scale, el = cur.t - s.t;
      if (el < 0.03 || D.samples.length - i < S.holdFrames) continue;       // must span the hold-frames count
      if (Math.abs(dx) >= G.swipeTravel && Math.abs(dx) / el >= need) {
        const dir = dx > 0 ? 1 : -1;
        if (dir === -D.lastDir && t < D.oppT) break;                         // that's the hand coming back
        this.ev.face = dir; this.lit[dir > 0 ? 'right' : 'left'] = t;
        D.lastDir = dir; D.coolT = t + G.swipeCooldown; D.oppT = t + G.swipeReturnBlock; D.samples = [cur];
        break;
      }
    }
  },

  /* ----- what the game reads ----- */
  // run speed 0..1, including the "keep running for 0.4 s" grace
  runValue() { return (now() / 1000 - this.walkT) <= TUNE.feel.runHold + 0.12 ? this.walkSpeed : 0; },
  take() {                       // snapshot + clear the one-shot events
    const e = this.ev, out = { run: this.runValue(), face: e.face, jump: e.jump, spin: e.spin, palm: this.stable === 'palm' };
    e.face = 0; e.jump = e.spin = false;
    return out;
  },
  handsVisible() { return now() / 1000 - this.seenAny < 0.35; },
  actionVisible() { return now() / 1000 - this.seenAction < 0.5; },
  // which icon to show next to the camera preview
  icon() {
    const t = now() / 1000, L = this.lit;
    if (t - L.left < 0.5) return 'left';
    if (t - L.right < 0.5) return 'right';
    if (this.stable === 'palm') return 'palm';
    if (this.stable === 'fist') return 'fist';
    if (this.walking) return 'run';
    if (this.stable === 'two') return 'two';
    return 'none';
  },

  /* ----- camera preview with hand skeletons, drawn into the pixel canvas ----- */
  drawPreview(ctx, x, y, w, h, big) {
    ctx.fillStyle = INK; ctx.fillRect(x - 2, y - 2, w + 4, h + 4);
    ctx.fillStyle = '#b9bed3'; ctx.fillRect(x - 1, y - 1, w + 2, h + 2);
    if (this.pv && this.live) ctx.drawImage(this.pv, x, y, w, h); else { ctx.fillStyle = '#241640'; ctx.fillRect(x, y, w, h); }
    if (!this.live) return;
    ctx.save(); ctx.beginPath(); ctx.rect(x, y, w, h); ctx.clip();
    for (const hd of this.hands) {
      const col = hd.role === 'action' ? '#ffb02e' : hd.role === 'dir' ? '#5ce6ff' : '#fff';
      ctx.fillStyle = col;
      for (const [a, b] of HAND_LINKS) pxLine(ctx, x + hd.lm[a].x * w, y + hd.lm[a].y * h, x + hd.lm[b].x * w, y + hd.lm[b].y * h, big ? 2 : 1);
      ctx.fillStyle = '#fff';
      const d = big ? 3 : 1;
      for (const k of [4, 8, 12, 16, 20]) ctx.fillRect(Math.round(x + hd.lm[k].x * w) - (d >> 1), Math.round(y + hd.lm[k].y * h) - (d >> 1), d, d);
      if (big) text(ctx, hd.role === 'action' ? 'ACTION' : hd.role === 'dir' ? 'TURN' : '', x + hd.lm[0].x * w, Math.min(y + h - 9, y + hd.lm[0].y * h + 5), { a: 'c', c: col });
    }
    ctx.restore();
    if (!this.handsVisible() && Math.floor(now() / 300) % 2) text(ctx, big ? 'HANDS NOT IN VIEW' : 'NO HANDS', x + w / 2, y + h / 2 - (big ? 7 : 3), { a: 'c', c: '#ff7a6a', s: big ? 2 : 1 });
  },
};
Gest.resetDetectors();

function pxLine(ctx, x0, y0, x1, y1, t) {
  x0 = Math.round(x0); y0 = Math.round(y0); x1 = Math.round(x1); y1 = Math.round(y1);
  const dx = Math.abs(x1 - x0), dy = -Math.abs(y1 - y0), sx = x0 < x1 ? 1 : -1, sy = y0 < y1 ? 1 : -1;
  let err = dx + dy, guard = 600;
  while (guard--) {
    ctx.fillRect(x0, y0, t, t);
    if (x0 === x1 && y0 === y1) break;
    const e2 = 2 * err;
    if (e2 >= dy) { err += dy; x0 += sx; }
    if (e2 <= dx) { err += dx; y0 += sy; }
  }
}

/* #####################################################################
   8. SCREENS - title, camera setup, calibration, gesture test, menus
   All drawn on the game canvas with a tiny widget kit, so every screen
   works by touch, keyboard, and (where it makes sense) gestures:
   swipe the direction hand to move, hold an open palm to select.
   ##################################################################### */
class UI {
  constructor() { this.w = []; this.focus = 0; this.drag = null; }
  button(x, y, w, h, label, fn, o) { const b = Object.assign({ type: 'button', x, y, w, h, label, fn }, o); this.w.push(b); return b; }
  slider(x, y, w, label, get, set, fmt, steps) { const s = { type: 'slider', x, y, w, h: 28, label, get, set, fmt, steps }; this.w.push(s); return s; }
  cur() { return this.w[this.focus]; }
  move(d) {
    const n = this.w.length; if (!n) return;
    for (let i = 0; i < n; i++) { this.focus = (this.focus + d + n) % n; if (!this.w[this.focus].skip) break; }
    Snd.sfx('move');
  }
  press() { const b = this.cur(); if (!b || b.type !== 'button') return; if (b.off) { Snd.sfx('back'); return; } Snd.sfx(b.back ? 'back' : 'ok'); b.fn(); }
  nudge(d) { const s = this.cur(); if (!s || s.type !== 'slider') return false; this.setSlider(s, s.get() + d * (s.steps ? 1 / (s.steps - 1) : 0.05)); return true; }
  setSlider(s, v) { v = clamp(v, 0, 1); if (s.steps) v = Math.round(v * (s.steps - 1)) / (s.steps - 1); if (v !== s.get()) { s.set(v); Snd.sfx('tick'); } }
  key(code) {
    if (code === 'ArrowUp') { this.move(-1); return true; }
    if (code === 'ArrowDown' || code === 'Tab') { this.move(1); return true; }
    if (code === 'ArrowLeft') { if (!this.nudge(-1)) this.move(-1); return true; }
    if (code === 'ArrowRight') { if (!this.nudge(1)) this.move(1); return true; }
    if (code === 'Enter' || code === 'Space') { this.press(); return true; }
    return false;
  }
  pointer(type, x, y) {
    if (type === 'down') {
      for (let i = 0; i < this.w.length; i++) {
        const b = this.w[i];
        if (x >= b.x - 2 && x <= b.x + b.w + 2 && y >= b.y - 2 && y <= b.y + b.h + 2) {
          this.focus = i;
          if (b.type === 'slider') { this.drag = b; this.setSlider(b, (x - b.x - 4) / (b.w - 8)); } else this.press();
          return true;
        }
      }
    } else if (type === 'move' && this.drag) this.setSlider(this.drag, (x - this.drag.x - 4) / (this.drag.w - 8));
    else if (type === 'up') this.drag = null;
    return false;
  }
  draw(ctx, hold) {
    this.w.forEach((b, i) => {
      const f = i === this.focus, lab = typeof b.label === 'function' ? b.label() : b.label;
      if (b.type === 'button') {
        if (b.paint) { b.paint(ctx, b, f); return; }
        ctx.fillStyle = INK; ctx.fillRect(b.x, b.y + 2, b.w, b.h);
        ctx.fillStyle = b.off ? '#4a3c6c' : f ? '#ffe36e' : '#8672b0'; ctx.fillRect(b.x, b.y, b.w, b.h);
        ctx.fillStyle = b.off ? '#2a1e46' : f ? '#d8344c' : '#3a2c5c'; ctx.fillRect(b.x + 2, b.y + 2, b.w - 4, b.h - 4);
        ctx.fillStyle = b.off ? '#3a2c5c' : f ? '#ff7a84' : '#55437c'; ctx.fillRect(b.x + 2, b.y + 2, b.w - 4, 1);
        const s = b.h >= 20 ? 2 : 1;
        text(ctx, lab, b.x + b.w / 2, b.y + (b.h - 7 * s) / 2, { s, a: 'c', c: b.off ? '#7c6ea0' : '#fff' });
        if (f && hold > 0) { ctx.fillStyle = '#8dffc0'; ctx.fillRect(b.x + 2, b.y + b.h - 5, Math.round((b.w - 4) * hold), 3); }
      } else {
        const val = b.get();
        text(ctx, lab, b.x, b.y, { s: 2, c: f ? '#ffe36e' : '#fff' });
        text(ctx, b.fmt ? b.fmt(val) : Math.round(val * 100), b.x + b.w, b.y, { s: 2, a: 'r', c: '#b4fbff' });
        ctx.fillStyle = INK; ctx.fillRect(b.x, b.y + 17, b.w, 10);
        ctx.fillStyle = f ? '#ffe36e' : '#8672b0'; ctx.fillRect(b.x, b.y + 17, b.w, 1); ctx.fillRect(b.x, b.y + 26, b.w, 1);
        ctx.fillStyle = '#3a2c5c'; ctx.fillRect(b.x + 2, b.y + 19, b.w - 4, 6);
        ctx.fillStyle = '#3fd0ee'; ctx.fillRect(b.x + 2, b.y + 19, Math.round((b.w - 4) * val), 6);
        const kx = Math.round(b.x + 4 + (b.w - 8) * val);
        ctx.fillStyle = INK; ctx.fillRect(kx - 4, b.y + 15, 8, 14); ctx.fillStyle = f ? '#ffe36e' : '#fff'; ctx.fillRect(kx - 3, b.y + 16, 6, 12);
      }
    });
  }
}

const canvas = document.getElementById('game');
const CTX = canvas.getContext('2d', { alpha: false });
CTX.imageSmoothingEnabled = false;

// scrolling desert vista behind the menus
function vista(ctx, t, dim) {
  const bg = bgCache.desert || (bgCache.desert = Backdrops.desert()), cx = Math.floor(t * 26), pal = WORLDS.desert.ground, gy = 238;
  for (const l of bg) { const o = Math.floor(cx * l.f) % BG_W; ctx.drawImage(l.c, -o, 0); if (o > BG_W - VIEW_W) ctx.drawImage(l.c, BG_W - o, 0); }
  ctx.fillStyle = pal[2]; ctx.fillRect(0, gy, VIEW_W, VIEW_H - gy);
  ctx.fillStyle = pal[3];
  for (let i = 0; i < 40; i++) { const x = ((hash2(i, 1) * 600 - cx) % 600 + 600) % 600 - 60; ctx.fillRect(Math.round(x), gy + 6 + Math.floor(hash2(i, 2) * 24), 6 + Math.floor(hash2(i, 3) * 10), 1); }
  for (let i = 0; i < 4; i++) { const x = ((i * 190 + 300 - cx) % 760 + 760) % 760 - 100; drawSpr(ctx, i % 2 ? SPR.props.tree : SPR.props.rock, x, gy + 1); }
  ctx.fillStyle = pal[0]; ctx.fillRect(0, gy, VIEW_W, 1); ctx.fillStyle = pal[1]; ctx.fillRect(0, gy + 1, VIEW_W, 2);
  drawSpr(ctx, SPR.hero.run[Math.floor(t * 12) % 6], 96, gy);
  if (dim) { ctx.globalAlpha = dim; ctx.fillStyle = '#140c28'; ctx.fillRect(0, 0, VIEW_W, VIEW_H); ctx.globalAlpha = 1; }
}
function panel(ctx, x, y, w, h) {
  ctx.fillStyle = INK; ctx.fillRect(x, y + 2, w, h);
  ctx.fillStyle = '#8672b0'; ctx.fillRect(x, y, w, h);
  ctx.fillStyle = '#241640'; ctx.fillRect(x + 2, y + 2, w - 4, h - 4);
}
// small camera preview in the top-right corner of menu screens, so you can see your hands
function cornerCam(ctx) {
  if (!Gest.live) return;
  const w = 72, h = Math.round(w / Gest.aspect);
  Gest.drawPreview(ctx, VIEW_W - w - 5, 5, w, h, false);
  drawSpr(ctx, SPR.icons[Gest.icon()], VIEW_W - 5 - w / 2, h + 20);
}
const NAV_HINT = () => Gest.live ? 'HOLD AN OPEN PALM TO SELECT - SWIPE YOUR OTHER HAND TO MOVE' : 'ARROW KEYS + ENTER, OR TAP';
function toggleFullscreen() {
  const d = document, el = d.documentElement;
  try {
    if (d.fullscreenElement || d.webkitFullscreenElement) (d.exitFullscreen || d.webkitExitFullscreen).call(d);
    else {
      const rq = el.requestFullscreen || el.webkitRequestFullscreen; if (!rq) return;
      const p = rq.call(el, { navigationUI: 'hide' });
      if (p && p.then) p.then(() => { try { screen.orientation.lock('landscape').catch(() => {}); } catch (e) {} }).catch(() => {});
    }
  } catch (e) { /* not supported (iPhone Safari): ignore */ }
}
// keep the screen awake (Wake Lock API); re-acquired whenever the page becomes visible again
const Wake = {
  lock: null, want: false,
  async on() {
    this.want = true;
    try {
      if (!('wakeLock' in navigator) || this.lock) return;
      this.lock = await navigator.wakeLock.request('screen');
      this.lock.addEventListener('release', () => { this.lock = null; });
    } catch (e) { this.lock = null; }
  },
};

const App = {
  cur: null, name: '', t: 0, hold: 0, holdArmed: false, toast: null, fps: 60, sawTouch: false,
  go(name, arg) {
    if (this.cur && this.cur.leave) this.cur.leave();
    this.cur = Screens[name]; this.name = name; this.t = 0; this.hold = 0; this.holdArmed = false;
    Input.edges.clear();
    if (this.cur.enter) this.cur.enter(arg);
  },
  say(msg) { this.toast = { msg, t: 2.2 }; },
  update(dt) {
    this.t += dt;
    if (this.toast && (this.toast.t -= dt) <= 0) this.toast = null;
    const s = this.cur, gest = Gest.live ? Gest.take() : null;
    // gestures in menus: swipe = move, hold an open palm = select
    if (s.ui && gest && s.gestureNav && s.gestureNav()) {
      if (gest.face) s.ui.move(gest.face);
      if (gest.palm) {
        if (this.holdArmed) { this.hold += dt / TUNE.gesture.menuPalmHold; if (this.hold >= 1) { this.hold = 0; this.holdArmed = false; s.ui.press(); } }
      } else { this.hold = 0; if (this.t > 0.5) this.holdArmed = true; }      // palm must be lowered once first
    } else this.hold = 0;
    if (this.cur === s && s.update) s.update(dt, gest);
    Input.edges.clear();
  },
  draw() {
    const ctx = CTX;
    this.cur.draw(ctx);
    if (this.toast) {
      const w = Font.width(this.toast.msg, 2) + 20;
      ctx.fillStyle = INK; ctx.fillRect((VIEW_W - w) / 2, 124, w, 24); ctx.fillStyle = '#ffe36e'; ctx.fillRect((VIEW_W - w) / 2, 124, w, 1); ctx.fillRect((VIEW_W - w) / 2, 147, w, 1);
      text(ctx, this.toast.msg, VIEW_W / 2, 129, { s: 2, a: 'c' });
    }
  },
  key(code) {
    const s = this.cur;
    if (code === 'KeyM') { const S = settings(); S.music = S.sfx = !(S.music || S.sfx); Snd.applySettings(); Save.store(); return; }
    if (code === 'KeyF') { toggleFullscreen(); return; }
    if (s.key && s.key(code)) return;
    if (code === 'Escape' && s.back) { Snd.sfx('back'); s.back(); return; }
    if (s.ui && (!s.uiOn || s.uiOn())) s.ui.key(code);
  },
  pointer(type, x, y, id) {
    const s = this.cur;
    if (s.pointer && s.pointer(type, x, y, id)) return;
    if (s.ui && (!s.uiOn || s.uiOn())) s.ui.pointer(type, x, y);
  },
};

/* ----- calibration: show both hands, pick the action hand ----- */
Screens.calib = {
  enter() {
    this.step = 'show'; this.seen = 0; this.lost = 0; this.pickT = 0; this.pickSide = ''; this.doneT = 0;
    this.ui = new UI();
    this.ui.button(8, 236, 120, 26, 'LEFT HAND', () => this.choose('left'));
    this.ui.button(352, 236, 120, 26, 'RIGHT HAND', () => this.choose('right'));
    if (settings().calibrated) this.ui.button(180, 240, 120, 20, 'SKIP', () => App.go('menu'), { back: true });
    this.ui.focus = -1;
  },
  gestureNav: () => false,
  back() { App.go('menu'); },
  choose(side, label) {
    const S = settings();
    S.actionSide = side; S.calibrated = true; S.actionLabel = label || '';
    Save.store(); Gest.memA = Gest.memD = null; Gest.resetDetectors();
    this.step = 'done'; this.doneT = 0; Snd.sfx('check');
  },
  update(dt) {
    if (!Gest.live) { App.go('menu'); return; }
    const hs = Gest.hands, S = settings();
    if (this.step === 'show') {
      this.seen = hs.length >= 2 ? this.seen + dt : Math.max(0, this.seen - dt * 2);
      if (this.seen > 0.6) { this.step = 'pick'; this.pickT = 0; Snd.sfx('ok'); }
    } else if (this.step === 'pick') {
      if (hs.length < 2) { this.lost += dt; this.pickT = Math.max(0, this.pickT - dt * 2); if (this.lost > 1.5) { this.step = 'show'; this.seen = 0; } return; }
      this.lost = 0;
      const l = hs[0].cx <= hs[1].cx ? hs[0] : hs[1], r = l === hs[0] ? hs[1] : hs[0];
      const fl = l.g === 'Closed_Fist' && l.gs >= S.minScore, fr = r.g === 'Closed_Fist' && r.gs >= S.minScore;
      if (fl !== fr) {
        const side = fl ? 'left' : 'right';
        if (side !== this.pickSide) { this.pickSide = side; this.pickT = 0; }
        this.pickT += dt;
        if (this.pickT > 0.9) this.choose(side, (fl ? l : r).label);
      } else this.pickT = Math.max(0, this.pickT - dt * 2);
    } else { this.doneT += dt; if (this.doneT > 2.4) App.go('menu'); }
  },
  draw(ctx) {
    vista(ctx, App.t, 0.72);
    const S = settings(), ph = 148, pw = Math.round(ph * Gest.aspect), px = Math.round((VIEW_W - pw) / 2), py = 58;
    text(ctx, 'HAND SETUP', VIEW_W / 2, 6, { s: 3, a: 'c', c: '#ffe36e' });
    const msg = this.step === 'show' ? 'SHOW BOTH HANDS TO THE CAMERA' : this.step === 'pick' ? 'MAKE A FIST WITH YOUR ACTION HAND' : 'ACTION HAND: ' + S.actionSide.toUpperCase();
    text(ctx, msg, VIEW_W / 2, 34, { s: 2, a: 'c', c: this.step === 'done' ? '#8dffc0' : '#fff' });

/* ----- playing ----- */
const TOUCH_BTNS = [
  { k: 'left', x: 6, y: 206, w: 54, h: 54, label: '<' }, { k: 'right', x: 66, y: 206, w: 54, h: 54, label: '>' },
  { k: 'spin', x: 360, y: 206, w: 54, h: 54, label: 'X' }, { k: 'jump', x: 420, y: 206, w: 54, h: 54, label: 'A' },
];
Screens.play = {
  enter(arg) {
    if (arg && arg.resume) { this.setPause('menu'); return; }       // coming back from the gesture test
    Game.start(arg);
    this.paused = ''; this.back2 = 0; this.count = 0; this.ptr = {};
    this.buildPause();
    Wake.on();
  },
  buildPause() {
    this.ui = new UI();
    this.ui.button(150, 96, 180, 28, 'RESUME', () => this.setPause(''));
    this.ui.button(150, 130, 180, 28, 'GESTURE TEST', () => App.go('test', 'play'));
    this.ui.button(150, 164, 180, 28, 'RESTART COURSE', () => App.go('play', Game.course.id));
    this.ui.button(150, 198, 180, 28, 'QUIT TO MENU', () => { Game.active = false; App.go('menu'); }, { back: true });
  },
  leave() { for (const k in Input.touch) Input.touch[k] = false; Snd.duck(false); },
  setPause(why) {
    if (!!why !== !!this.paused) Snd.sfx('pause');
    this.paused = why; this.back2 = 0; this.count = 0; Snd.duck(!!why);
    if (this.ui) this.ui.focus = 0;
    App.hold = 0; App.holdArmed = false; App.t = 0;
  },
  uiOn() { return this.paused === 'menu'; },
  gestureNav() { return this.paused === 'menu'; },
  key(code) {
    if (code === 'Escape' || code === 'KeyP') { if (this.paused) this.setPause(''); else if (Game.state === 'play') this.setPause('menu'); return true; }
    return !this.paused;       // while playing, keys go to the game, not to menus
  },
  pointer(type, x, y, id) {
    if (this.paused === 'menu') return false;
    if (this.paused === 'hands') { if (type === 'down') this.setPause('menu'); return true; }
    if (type === 'down') {
      if (y < 26 && x > 200 && x < 280) { this.setPause('menu'); return true; }          // pause button
      for (const b of TOUCH_BTNS) if (!Gest.live && App.sawTouch && x >= b.x && x <= b.x + b.w && y >= b.y - 6 && y <= b.y + b.h) {
        this.ptr[id] = b.k; Input.touch[b.k] = true; if (b.k === 'jump') Input.touch.jumpEdge = true; if (b.k === 'spin') Input.touch.spinEdge = true;
      }
    } else if (type === 'up') { const k = this.ptr[id]; if (k) { Input.touch[k] = false; delete this.ptr[id]; } }
    return true;
  },
  update(dt, gest) {
    const G = TUNE.gesture, t = now() / 1000, h = Game.hero;
    if (this.paused === 'hands') {
      // hands left the frame: wait for them, then a short countdown so nothing happens by surprise
      if (!Gest.live) { this.setPause('menu'); return; }
      if (Gest.handsVisible()) {
        this.back2 += dt;
        if (this.back2 > G.handsBackResume) { if (!this.count) { this.count = 1.5; Snd.sfx('ok'); } this.count -= dt; if (this.count <= 0) { this.setPause(''); Gest.resetDetectors(); } }
      } else { this.back2 = 0; this.count = 0; }
      return;
    }
    if (this.paused) return;
    if (Gest.live && Game.state === 'play' && t - Gest.seenAny > G.handsLostPause) { this.setPause('hands'); return; }
    Gest.air = !h.onGround && h.airJumps < 1 && !h.inQuick;
    const ctl = Input.poll(gest), r = Game.update(dt, ctl);
    if (r === 'gameover') App.go('over'); else if (r === 'clear') App.go('clear');
  },
  draw(ctx) {
    Game.draw(ctx);
    const live = Gest.live, t = now() / 1000;
    if (live) {
      const w = 80, hh = Math.round(w / Gest.aspect);
      Gest.drawPreview(ctx, VIEW_W - w - 4, 4, w, hh, false);
      drawSpr(ctx, SPR.icons[Gest.icon()], VIEW_W - w - 18, 38);
      if (!this.paused && Gest.handsVisible() && !Gest.actionVisible() && Math.floor(t * 3) % 2) text(ctx, 'SHOW YOUR ACTION HAND', VIEW_W - 4, hh + 10, { a: 'r', c: '#ffb0a0' });
    } else if (App.sawTouch && !this.paused) {
      for (const b of TOUCH_BTNS) {
        ctx.globalAlpha = Input.touch[b.k] ? 0.75 : 0.4; ctx.fillStyle = INK; ctx.fillRect(b.x, b.y, b.w, b.h);
        ctx.fillStyle = '#fff'; ctx.fillRect(b.x, b.y, b.w, 2); ctx.fillRect(b.x, b.y + b.h - 2, b.w, 2); ctx.fillRect(b.x, b.y, 2, b.h); ctx.fillRect(b.x + b.w - 2, b.y, 2, b.h);
        ctx.globalAlpha = 0.9; text(ctx, b.label, b.x + b.w / 2, b.y + 16, { s: 3, a: 'c' }); ctx.globalAlpha = 1;
      }
    }
    if (!this.paused) { ctx.globalAlpha = 0.7; ctx.fillStyle = '#fff'; ctx.fillRect(235, 7, 3, 11); ctx.fillRect(242, 7, 3, 11); ctx.globalAlpha = 1; return; }
    ctx.globalAlpha = 0.72; ctx.fillStyle = '#140c28'; ctx.fillRect(0, 0, VIEW_W, VIEW_H); ctx.globalAlpha = 1;
    if (this.paused === 'hands') {
      text(ctx, 'HANDS NOT IN VIEW', VIEW_W / 2, 30, { s: 4, a: 'c', c: '#ff7a6a' });
      const pw = 150, ph = Math.round(pw / Gest.aspect);
      Gest.drawPreview(ctx, (VIEW_W - pw) / 2, 74, pw, ph, true);
      if (this.count > 0) {
        text(ctx, 'GET READY!', VIEW_W / 2, 204, { s: 3, a: 'c', c: '#8dffc0' });
        ctx.fillStyle = INK; ctx.fillRect(140, 232, 200, 10); ctx.fillStyle = '#8dffc0'; ctx.fillRect(141, 233, Math.round(198 * (1 - this.count / 1.5)), 8);
      } else {
        text(ctx, 'HOLD YOUR HANDS UP TO THE CAMERA', VIEW_W / 2, 204, { s: 2, a: 'c' });
        text(ctx, 'THE GAME CONTINUES BY ITSELF WHEN IT SEES THEM. TAP FOR THE MENU.', VIEW_W / 2, 228, { a: 'c', c: '#b4fbff' });
      }
    } else {
      text(ctx, 'PAUSED', VIEW_W / 2, 44, { s: 5, a: 'c', c: '#ffe36e' });

/* #####################################################################
   9. MAIN LOOP + page plumbing
   ##################################################################### */
const stage = document.getElementById('stage');
function fit() {      // largest 16:9 box that fits the window
  const vw = window.innerWidth, vh = window.innerHeight;
  let w = vw, h = Math.round(vw * 9 / 16);
  if (h > vh) { h = vh; w = Math.round(vh * 16 / 9); }
  stage.style.width = w + 'px'; stage.style.height = h + 'px';
  stage.style.marginLeft = (-w / 2) + 'px'; stage.style.marginTop = (-h / 2) + 'px';
}
window.addEventListener('resize', fit); window.addEventListener('orientationchange', () => setTimeout(fit, 250));

const toGame = (e) => { const r = canvas.getBoundingClientRect(); return [(e.clientX - r.left) / r.width * VIEW_W, (e.clientY - r.top) / r.height * VIEW_H]; };
let firstTouch = true;
canvas.addEventListener('pointerdown', (e) => {
  e.preventDefault(); Snd.unlock(); Wake.on();
  if (e.pointerType === 'touch') { App.sawTouch = true; if (firstTouch) { firstTouch = false; toggleFullscreen(); } }
  const [x, y] = toGame(e); App.pointer('down', x, y, e.pointerId);
});
canvas.addEventListener('pointermove', (e) => { const [x, y] = toGame(e); App.pointer('move', x, y, e.pointerId); });
for (const ev of ['pointerup', 'pointercancel']) window.addEventListener(ev, (e) => { const [x, y] = toGame(e); App.pointer('up', x, y, e.pointerId); });
window.addEventListener('keydown', (e) => {
  if (e.metaKey || e.ctrlKey || e.altKey) return;
  if (['ArrowUp', 'ArrowDown', 'ArrowLeft', 'ArrowRight', 'Space', 'Tab', 'Enter'].includes(e.code)) e.preventDefault();
  Snd.unlock();
  if (!e.repeat) { Input.down(e.code); App.key(e.code); }
  else if (App.cur && App.cur.ui && (e.code === 'ArrowLeft' || e.code === 'ArrowRight') && App.cur.ui.cur() && App.cur.ui.cur().type === 'slider') App.cur.ui.key(e.code);
});
window.addEventListener('keyup', (e) => Input.up(e.code));
window.addEventListener('blur', () => Input.keys.clear());
window.addEventListener('contextmenu', (e) => e.preventDefault());
document.addEventListener('visibilitychange', () => {
  const hidden = document.visibilityState !== 'visible';
  if (hidden) { if (App.name === 'play' && !Screens.play.paused && Game.state === 'play') Screens.play.setPause('menu'); Input.keys.clear(); }
  else { if (Wake.want) Wake.on(); if (Gest.video && Gest.stream && Gest.video.paused) Gest.video.play().catch(() => {}); Gest.seenAny = now() / 1000; }
  Snd.suspend(hidden);
});

// Fixed 60 Hz game step, drawn once per display frame. Hand tracking is scheduled
// separately (Gest.afterFrame) so a slow tracker can never slow the game logic.
const STEP = 1 / 60;
let last = 0, acc = 0;
function frame(t) {
  requestAnimationFrame(frame);
  const dt = Math.min(0.1, (t - last) / 1000 || 0); last = t;
  if (dt > 0) App.fps = lerp(App.fps, 1 / dt, 0.05);
  acc += dt;
  let n = 0;
  while (acc >= STEP && n < 6) { App.update(STEP); acc -= STEP; n++; }
  if (n === 6) acc = 0;
  App.draw();
  Gest.afterFrame();
}

buildArt();
fit();
App.go('start');
requestAnimationFrame(frame);

// handy for debugging / automated tests from the browser console
window.SUPERSPACE = { TUNE, Save, Snd, Game, Gest, Input, App, Screens, COURSES, WORLDS, ENEMIES, BOSSES, SPR, Level };
})();
</script>
</body>
